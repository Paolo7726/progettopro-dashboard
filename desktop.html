<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progetto Pro — Match Scanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:       #0a0d12;
  --surface:  #111520;
  --card:     #161c2a;
  --border:   #1f2a40;
  --accent:   #00d4aa;
  --accent2:  #f7b731;
  --accent3:  #e74c5e;
  --text:     #e8edf5;
  --muted:    #5a6580;
  --green:    #00d4aa;
  --yellow:   #f7b731;
  --red:      #e74c5e;
  --blue:     #4a9eff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  color: var(--accent);
  letter-spacing: -0.5px;
}
.logo span { color: var(--text); }
.header-stats {
  display: flex;
  gap: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}
.header-stats b { color: var(--accent); }
.refresh-btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.refresh-btn:hover { opacity: 0.85; }

/* ── Filtri ── */
.filters {
  display: flex;
  gap: 10px;
  padding: 16px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
}
.filter-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'DM Mono', monospace;
  margin-right: 4px;
}
.chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Syne', sans-serif;
}
.chip:hover, .chip.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.chip.value-filter.active { background: var(--yellow); border-color: var(--yellow); }
.divider { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }

/* ── Layout principale ── */
.main {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 0;
  height: calc(100vh - 120px);
}
.match-list { overflow-y: auto; padding: 20px 28px; }
.preview-panel {
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  position: sticky;
  top: 120px;
  height: calc(100vh - 120px);
}

/* ── Match card ── */
.day-header {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 16px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.match-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.match-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.18s;
}
.match-card:hover { border-color: var(--accent); }
.match-card:hover::before { background: var(--accent); }
.match-card.selected { border-color: var(--accent); background: #0d1824; }
.match-card.selected::before { background: var(--accent); }
.match-card.has-value::before { background: var(--yellow) !important; }
.match-card.has-value { border-color: #2a2510; }

.match-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}
.match-teams {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}
.match-teams .vs {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
  margin: 0 6px;
  font-family: 'DM Mono', monospace;
}
.match-meta {
  display: flex;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-bottom: 6px;
  align-items: center;
}
.league-badge {
  background: var(--border);
  color: var(--text);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  font-family: 'Syne', sans-serif;
}

/* ── Quote row ── */
.odds-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 10px;
}
.odd-box {
  text-align: center;
  background: var(--bg);
  border-radius: 6px;
  padding: 6px 4px;
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.odd-box.bet {
  background: rgba(0,212,170,0.12);
  border-color: var(--accent);
}
.odd-label {
  font-size: 10px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  display: block;
  margin-bottom: 2px;
}
.odd-value {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
}
.odd-box.bet .odd-value { color: var(--accent); }
.value-badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(247,183,49,0.15);
  color: var(--yellow);
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  display: block;
  margin-top: 2px;
}
.value-badge.positive { background: rgba(0,212,170,0.15); color: var(--accent); }

/* ── Preview Panel ── */
.preview-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  gap: 12px;
  text-align: center;
  padding: 40px;
}
.preview-placeholder .icon { font-size: 48px; opacity: 0.3; }
.preview-placeholder p { font-size: 14px; line-height: 1.6; }

.preview-content { padding: 24px 20px; }
.preview-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  margin-bottom: 4px;
  line-height: 1.2;
}
.preview-sub {
  font-size: 12px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-bottom: 20px;
}

/* ── Prob bars ── */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.prob-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.prob-label {
  font-size: 12px;
  color: var(--muted);
  width: 90px;
  flex-shrink: 0;
}
.prob-bar-wrap {
  flex: 1;
  background: var(--border);
  border-radius: 4px;
  height: 7px;
  overflow: hidden;
}
.prob-bar {
  height: 100%;
  border-radius: 4px;
  background: var(--accent);
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.prob-bar.amber { background: var(--yellow); }
.prob-bar.red   { background: var(--red); }
.prob-bar.blue  { background: var(--blue); }
.prob-pct {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  width: 44px;
  text-align: right;
  color: var(--text);
}
.fair-odds {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  width: 52px;
  text-align: right;
}
.value-chip {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  min-width: 48px;
  text-align: center;
}
.value-chip.pos { background: rgba(0,212,170,0.15); color: var(--accent); }
.value-chip.neg { background: rgba(231,76,94,0.12); color: var(--red); }
.value-chip.none { opacity: 0; }

/* ── Lambda box ── */
.lambda-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0;
}
.lambda-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.lambda-team {
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lambda-value {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: var(--accent);
}
.lambda-label {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Over/Under ── */
.ou-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin: 4px 0;
}
.ou-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  text-align: center;
}
.ou-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
.ou-pct { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
.ou-fair { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }

/* ── Decision badge ── */
.decision-row {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.decision-badge {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
}
.decision-badge.bet   { background: rgba(0,212,170,0.15); border: 1px solid var(--accent); color: var(--accent); }
.decision-badge.watch { background: rgba(247,183,49,0.12); border: 1px solid var(--yellow); color: var(--yellow); }
.decision-badge.skip  { background: rgba(90,101,128,0.12); border: 1px solid var(--border); color: var(--muted); }
.decision-badge .sub  { font-size: 10px; font-weight: 400; display: block; margin-top: 2px; font-family: 'DM Mono', monospace; }

/* ── Confidence bar ── */
.conf-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}
.conf-bar-wrap { flex: 1; background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
.conf-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--blue)); }
.conf-label { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
.conf-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Animazioni ── */
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.match-card { animation: fadeIn 0.25s ease both; }
.preview-content { animation: fadeIn 0.3s ease both; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; height: auto; }
  .preview-panel { position: fixed; bottom: 0; left: 0; right: 0; height: 60vh; z-index: 200;
    border-left: none; border-top: 1px solid var(--border); transform: translateY(100%); transition: transform 0.3s; }
  .preview-panel.open { transform: translateY(0); }
  .match-list { padding-bottom: 80px; }
  .header-stats { display: none; }
}
</style>
</head>

<script>
// ══════════════════════════════════════════════════════════════════
// DATI — In produzione questi arrivano da VALUE_SCANNER Excel
// tramite VBA (macro legge foglio e scrive JSON) o da Python
// Per la demo usiamo dati realistici basati sul tuo sistema
// ══════════════════════════════════════════════════════════════════

let DEMO_DATA = []
let currentFilter = '';
let valueOnly = false;
let betOnly = false;
let selectedId = null;

function computeOverUnder(lh, la) {
  const tot = lh + la;
  return {
    ov05: 1 - Math.exp(-tot),
    ov15: 1 - Math.exp(-tot) * (1 + tot),
    ov25: 1 - Math.exp(-tot) * (1 + tot + tot*tot/2),
    ov35: 1 - Math.exp(-tot) * (1 + tot + tot*tot/2 + Math.pow(tot,3)/6),
    gg: (1-Math.exp(-lh)) * (1-Math.exp(-la)),
  };
}

function pct(v) { return (v != null && !isNaN(v)) ? (v*100).toFixed(1)+'%' : '—'; }
function fair(p) { return (p != null && !isNaN(p) && p > 0.01) ? (1/p).toFixed(2) : '—'; }

function valueChip(v) {
  if (v === null || v === undefined) return '<span class="value-chip none">—</span>';
  const cls = v > 0 ? 'pos' : 'neg';
  const sign = v > 0 ? '+' : '';
  return `<span class="value-chip ${cls}">${sign}${(v*100).toFixed(1)}%</span>`;
}

function renderCard(m, idx) {
  const isBet   = m.decision === 'BET';
  const isWatch = m.decision === 'WATCH';
  // hasValue: considera anche quando value è nullo ma odds ci sono
  const hasOdds = m.b365h > 1 || m.b365d > 1 || m.b365a > 1;
  const hasValue = (m.value1||0) > 0 || (m.valuex||0) > 0 || (m.value2||0) > 0;

  const bestValue = Math.max(m.value1||0, m.valuex||0, m.value2||0);
  const bestMkt = bestValue === m.value1 ? '1' : bestValue === m.valuex ? 'X' : '2';

  const decBadge = isBet
    ? `<span style="background:rgba(0,212,170,0.2);color:var(--accent);padding:3px 8px;border-radius:4px;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;">⚡ BET ${bestMkt}</span>`
    : isWatch
    ? `<span style="background:rgba(247,183,49,0.15);color:var(--yellow);padding:3px 8px;border-radius:4px;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;">👁 WATCH</span>`
    : '';

  return `
  <div class="match-card ${hasValue?'has-value':''} ${selectedId===m.id?'selected':''}"
       data-id="${m.id}"
       onclick="selectMatch('${m.id}')"
       style="animation-delay:${idx*0.04}s">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div>
        <span class="league-badge" style="${
        m.league==='Serie A'?'background:#1a3a5c;color:#4a9eff':
        m.league==='Serie B'?'background:#1a3a2a;color:#00d4aa':
        m.league==='Serie C'?'background:#2a2a1a;color:#f7b731':
        m.league==='Premier League'?'background:#1a0a2a;color:#a855f7':
        m.league==='La Liga'?'background:#3a1a1a;color:#e74c5e':
        m.league==='Bundesliga'?'background:#2a1a0a;color:#f97316':
        m.league==='Bundesliga 2'?'background:#1a0f00;color:#f59e0b':
        m.league==='Eredivisie'?'background:#001a0a;color:#10b981':
        m.league==='Jupiler Pro'?'background:#0a1a2a;color:#4a9eff':
        ''}">${m.league}</span>
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-left:8px;">${m.date}</span>
      </div>
      ${decBadge}
    </div>
    <div class="match-teams">${m.home} <span class="vs">vs</span> ${m.away}</div>
    <div class="odds-row">
      <div class="odd-box ${(m.value1||0)>0?'bet':(m.b365h>0&&m.b365h<1.5?'low':'')}">
        <span class="odd-label">1 Casa</span>
        <span class="odd-value">${m.b365h>0?m.b365h.toFixed(2):'—'}</span>
        ${(m.value1!=null)?`<span class="value-badge ${m.value1>0?'positive':'negative'}">${m.value1>0?'+':''}${(m.value1*100).toFixed(1)}%</span>`:''}
      </div>
      <div class="odd-box ${(m.valuex||0)>0?'bet':''}">
        <span class="odd-label">X Pareggio</span>
        <span class="odd-value">${m.b365d>0?m.b365d.toFixed(2):'—'}</span>
        ${(m.valuex!=null)?`<span class="value-badge ${m.valuex>0?'positive':'negative'}">${m.valuex>0?'+':''}${(m.valuex*100).toFixed(1)}%</span>`:''}
      </div>
      <div class="odd-box ${(m.value2||0)>0?'bet':''}">
        <span class="odd-label">2 Ospite</span>
        <span class="odd-value">${m.b365a>0?m.b365a.toFixed(2):'—'}</span>
        ${(m.value2!=null)?`<span class="value-badge ${m.value2>0?'positive':'negative'}">${m.value2>0?'+':''}${(m.value2*100).toFixed(1)}%</span>`:''}
      </div>
    </div>
  </div>`;
}

function renderList() {
  const list = document.getElementById('match-list');
  let filtered = DEMO_DATA.filter(m => {
    if (!m.home || !m.away) return false;  // salta righe vuote
    if (currentFilter && m.league !== currentFilter) return false;
    if (valueOnly && (m.value1||0) <= 0 && (m.valuex||0) <= 0 && (m.value2||0) <= 0) return false;
    if (betOnly && m.decision !== 'BET') return false;
    return true;
  });

  // Raggruppa per data
  const byDate = {};
  filtered.forEach(m => { (byDate[m.date] = byDate[m.date]||[]).push(m); });

  const bets  = filtered.filter(m=>m.decision==='BET').length;
  const watch = filtered.filter(m=>m.decision==='WATCH').length;
  document.getElementById('total-matches').textContent = filtered.length;
  document.getElementById('total-bets').textContent    = bets;
  document.getElementById('total-watch').textContent   = watch;

  let html = '';
  let cardIdx = 0;
  for (const date of Object.keys(byDate).sort()) {
    const todayISO = new Date().toISOString().slice(0,10);
    let label = date;
    if (date === todayISO) {
      label = 'Oggi';
    } else if (date) {
      try {
        const d = new Date(date + 'T12:00:00');
        label = d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
        label = label.charAt(0).toUpperCase() + label.slice(1);
      } catch(e) { label = date; }
    }
    html += `<div class="day-header">${label} — ${byDate[date].length} partite</div>`;
    html += byDate[date].map(m => renderCard(m, cardIdx++)).join('');
  }

  if (!html) html = `<div style="padding:40px;text-align:center;color:var(--muted);">
    <div style="font-size:32px;margin-bottom:12px;">🔍</div>
    <p>Nessuna partita con questi filtri</p>
  </div>`;

  list.innerHTML = html;
}

function selectMatch(id) {
  selectedId = id;

  // Trova la partita
  const m = DEMO_DATA.find(x => x.id === id);
  if (!m) { console.warn('Partita non trovata:', id); return; }

  document.querySelectorAll('.match-card').forEach(c => c.classList.remove('selected'));

  // Calcola Over/Under da lambda (se disponibile)
  const hasLambda = (m.lam_h != null && m.lam_a != null && !isNaN(m.lam_h));
  const ou = hasLambda ? computeOverUnder(m.lam_h, m.lam_a) : null;

  const conf = parseFloat(m.confidence) || 0;
  const decClass = m.decision === 'BET' ? 'bet' : m.decision === 'WATCH' ? 'watch' : 'skip';
  const decLabel = m.decision === 'BET' ? '⚡ BET' : m.decision === 'WATCH' ? '👁 WATCH' : '⛔ SKIP';

  // Helper locali null-safe
  const _pct  = v => (v != null && !isNaN(v)) ? (v * 100).toFixed(1) + '%' : '—';
  const _fair = p => (p != null && !isNaN(p) && p > 0.01) ? (1/p).toFixed(2) : '—';
  const _val  = v => {
    if (v == null) return '';
    const cls = v > 0 ? 'positive' : 'negative';
    const sign = v > 0 ? '+' : '';
    return `<span class="value-badge ${cls}">${sign}${(v*100).toFixed(1)}%</span>`;
  };
  const _odd  = v => (v && v > 1) ? v.toFixed(2) : '—';

  // Costruisci HTML pannello
  const panelHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);
                display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:10px;
                    color:var(--muted);margin-bottom:4px;">${m.league} · ${m.date}</div>
        <div style="font-family:'Syne',sans-serif;font-weight:800;
                    font-size:16px;line-height:1.3;">${m.home}<br>
          <span style="color:var(--muted);font-size:12px;font-weight:400;">vs</span>
          ${m.away}
        </div>
      </div>
      <div class="decision-badge ${decClass}" style="padding:8px 14px;">
        ${decLabel}
        <span class="sub">conf. ${(conf*100).toFixed(0)}%</span>
      </div>
    </div>

    <div style="padding:16px 20px;">

      <!-- QUOTE BOOKMAKER -->
      <div class="section-title">📋 Quote bookmaker</div>
      <div class="odds-row" style="margin-bottom:16px;">
        <div class="odd-box ${(m.value1||0)>0?'bet':''}">
          <span class="odd-label">1 Casa</span>
          <span class="odd-value">${_odd(m.b365h)}</span>
          ${_val(m.value1)}
        </div>
        <div class="odd-box ${(m.valuex||0)>0?'bet':''}">
          <span class="odd-label">X Pareggio</span>
          <span class="odd-value">${_odd(m.b365d)}</span>
          ${_val(m.valuex)}
        </div>
        <div class="odd-box ${(m.value2||0)>0?'bet':''}">
          <span class="odd-label">2 Ospite</span>
          <span class="odd-value">${_odd(m.b365a)}</span>
          ${_val(m.value2)}
        </div>
      </div>

      <!-- LAMBDA -->
      ${hasLambda ? `
      <div class="section-title">⚽ Gol attesi (λ)</div>
      <div class="lambda-grid">
        <div class="lambda-box">
          <div class="lambda-team">${m.home}</div>
          <div class="lambda-value">${m.lam_h.toFixed(2)}</div>
          <div class="lambda-label">λ Casa</div>
        </div>
        <div class="lambda-box">
          <div class="lambda-team">${m.away}</div>
          <div class="lambda-value">${m.lam_a.toFixed(2)}</div>
          <div class="lambda-label">λ Ospite</div>
        </div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--muted);
                  font-family:'DM Mono',monospace;margin:4px 0 12px;">
        Media gol attesi: <b style="color:var(--text)">${(m.lam_h+m.lam_a).toFixed(2)}</b>
      </div>` : `
      <div style="padding:8px 12px;background:var(--border);border-radius:6px;
                  font-size:11px;color:var(--muted);text-align:center;margin-bottom:12px;">
        λ non disponibile — lancia engine.py per calcolare le probabilità
      </div>`}

      <!-- CONFIDENCE -->
      ${conf > 0 ? `
      <div class="section-title">📊 Confidence</div>
      <div class="conf-row">
        <span class="conf-label">Confidence</span>
        <div class="conf-bar-wrap">
          <div class="conf-bar" style="width:${Math.min(conf*100,100).toFixed(0)}%"></div>
        </div>
        <span class="conf-value">${(conf*100).toFixed(0)}%</span>
      </div>
      ${(m.kelly > 0) ? `
      <div class="conf-row">
        <span class="conf-label">Kelly stake</span>
        <div class="conf-bar-wrap">
          <div class="conf-bar" style="width:${Math.min(m.kelly*500,100)}%;
               background:var(--yellow);"></div>
        </div>
        <span class="conf-value" style="color:var(--yellow);">
          ${(m.kelly*100).toFixed(1)}%
        </span>
      </div>` : ''}` : ''}

      <!-- PROBABILITA 1X2 -->
      ${(m.prob1 != null) ? `
      <div class="section-title">🎯 Probabilità 1X2</div>
      <div class="prob-row">
        <span class="prob-label">1 — Casa</span>
        <div class="prob-bar-wrap">
          <div class="prob-bar" style="width:${_pct(m.prob1)}"></div>
        </div>
        <span class="prob-pct">${_pct(m.prob1)}</span>
        <span class="fair-odds">Fair ${_fair(m.prob1)}</span>
        ${_val(m.value1)}
      </div>
      <div class="prob-row">
        <span class="prob-label">X — Pareggio</span>
        <div class="prob-bar-wrap">
          <div class="prob-bar amber" style="width:${_pct(m.probx)}"></div>
        </div>
        <span class="prob-pct">${_pct(m.probx)}</span>
        <span class="fair-odds">Fair ${_fair(m.probx)}</span>
        ${_val(m.valuex)}
      </div>
      <div class="prob-row">
        <span class="prob-label">2 — Ospite</span>
        <div class="prob-bar-wrap">
          <div class="prob-bar red" style="width:${_pct(m.prob2)}"></div>
        </div>
        <span class="prob-pct">${_pct(m.prob2)}</span>
        <span class="fair-odds">Fair ${_fair(m.prob2)}</span>
        ${_val(m.value2)}
      </div>` : ''}

      <!-- OVER/UNDER -->
      ${ou ? `
      <div class="section-title">📈 Over / Under</div>
      <div class="ou-grid">
        <div class="ou-box">
          <div class="ou-label">Over 0.5</div>
          <div class="ou-pct" style="color:var(--accent)">${_pct(ou.ov05)}</div>

          <div class="ou-label">Over 1.5</div>
          <div class="ou-pct" style="color:var(--accent)">${_pct(ou.ov15)}</div>

        </div>
        <div class="ou-box">
          <div class="ou-label">Over 2.5</div>
          <div class="ou-pct" style="color:var(--blue)">${_pct(ou.ov25)}</div>
          <div class="ou-fair">Fair ${_fair(ou.ov25)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">Over 3.5</div>
          <div class="ou-pct" style="color:var(--yellow)">${_pct(ou.ov35)}</div>
          <div class="ou-fair">Fair ${_fair(ou.ov35)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">GG</div>
          <div class="ou-pct" style="color:var(--accent)">${_pct(ou.gg)}</div>
          <div class="ou-fair">Fair ${_fair(ou.gg)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">NG</div>
          <div class="ou-pct" style="color:var(--red)">${_pct(1-ou.gg)}</div>
          <div class="ou-fair">Fair ${_fair(1-ou.gg)}</div>
        </div>
      </div>` : ''}

      <!-- NOTE -->
      <div style="margin-top:16px;padding:10px 12px;background:var(--bg);
                  border-radius:8px;border:1px solid var(--border);">
        <div style="font-size:10px;color:var(--muted);
                    font-family:'DM Mono',monospace;line-height:1.7;">
          📌 Fair = quota equa dal modello Poisson+Dixon-Coles<br>
          📌 Value% = prob_modello × quota - 1 (positivo = vantaggio)<br>
          📌 Confidence basata su Value% e AQ_FILTRATO
        </div>
      </div>
    </div>`;

  // Mostra il pannello
  const phEl = document.getElementById('preview-placeholder');
  const pc   = document.getElementById('preview-content');
  if (!pc) { console.error('preview-content non trovato'); return; }
  if (phEl) phEl.style.display = 'none';
  pc.innerHTML = panelHTML;
  pc.style.display = 'block';
  pc.scrollTop = 0;

  // Mobile: apri pannello
  const pp = document.getElementById('preview-panel');
  if (pp) pp.classList.add('open');
}



// Configurazione bottoni campionato (ordine e etichette)
const LEAGUE_CONFIG = [
  { key: 'Serie A',        label: 'Serie A'      },
  { key: 'Serie B',        label: 'Serie B'      },
  { key: 'Premier League', label: 'Premier'      },
  { key: 'Championship',   label: 'Championship' },
  { key: 'La Liga',        label: 'La Liga'      },
  { key: 'La Liga 2',      label: 'Liga 2'       },
  { key: 'Bundesliga',     label: 'Bundesliga'   },
  { key: 'Bundesliga 2',   label: 'Bundesliga 2' },
  { key: 'Ligue 1',        label: 'Ligue 1'      },
  { key: 'Eredivisie',     label: 'Olanda'       },
  { key: 'Jupiler Pro',    label: 'Belgio'       },
  { key: 'Super Lig',      label: 'Turchia'      },
  { key: 'Primeira Liga',  label: 'Portogallo'   },
];

function buildLeagueChips() {
  // Conta partite per campionato nei dati live
  const counts = {};
  (window.LIVE_DATA || []).forEach(r => {
    const c = r.Campionato || '';
    counts[c] = (counts[c] || 0) + 1;
  });

  const container = document.getElementById('league-filters');
  if (!container) return;

  // Rimuovi solo chip campionato (non chip-all, non value-filter, non bc)
  container.querySelectorAll('.chip:not(#chip-all):not(.value-filter)').forEach(b => {
    b.remove();
  });
  const divider = container.querySelector('.divider');

  // Aggiorna contatore su "Tutti"
  const total = (window.LIVE_DATA || []).length;
  const chipAll = document.getElementById('chip-all');
  if (chipAll) chipAll.textContent = `Tutti (${total})`;

  // Crea un bottone per ogni campionato che ha almeno 1 partita
  LEAGUE_CONFIG.forEach(cfg => {
    const n = counts[cfg.key] || 0;
    if (n === 0) return; // nascondi campionati senza partite
    const btn = document.createElement('button');
    btn.className = 'chip';
    btn.textContent = `${cfg.label} (${n})`;
    btn.onclick = () => filterLeague(cfg.key);
    btn.dataset.league = cfg.key;
    container.insertBefore(btn, divider);
  });
}

function filterLeague(league) {
  currentFilter = league;
  valueOnly = false;
  betOnly = false;
  // Aggiorna classe active su tutti i chip (chip-all + chip dinamici)
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  if (league === '') {
    const chipAll = document.getElementById('chip-all');
    if (chipAll) chipAll.classList.add('active');
  } else {
    document.querySelectorAll('[data-league]').forEach(b => {
      if (b.dataset.league === league) b.classList.add('active');
    });
  }
  renderList();
}
function filterValue() {
  valueOnly = !valueOnly;
  betOnly = false;
  document.querySelectorAll('.value-filter').forEach(c => c.classList.remove('active'));
  if (valueOnly) event.target.classList.add('active');
  renderList();
}
function filterBet() {
  betOnly = !betOnly;
  valueOnly = false;
  document.querySelectorAll('.value-filter').forEach(c => c.classList.remove('active'));
  if (betOnly) event.target.classList.add('active');
  renderList();
}

function parseDataItaliana(str) {
  // Converte "SABATO 18 APRILE 2026" → "2026-04-18"
  if (!str) return '';
  // Se già formato ISO
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0,10);
  const mesi = {
    'GENNAIO':'01','FEBBRAIO':'02','MARZO':'03','APRILE':'04',
    'MAGGIO':'05','GIUGNO':'06','LUGLIO':'07','AGOSTO':'08',
    'SETTEMBRE':'09','OTTOBRE':'10','NOVEMBRE':'11','DICEMBRE':'12'
  };
  const parts = str.toUpperCase().trim().split(/\s+/);
  // Formato: "SABATO 18 APRILE 2026" → parts[1]=giorno, parts[2]=mese, parts[3]=anno
  // Oppure: "18 APRILE 2026" → parts[0]=giorno, parts[1]=mese, parts[2]=anno
  let giorno, mese, anno;
  if (parts.length >= 4) {
    giorno = parts[1]; mese = mesi[parts[2]] || '01'; anno = parts[3];
  } else if (parts.length >= 3) {
    giorno = parts[0]; mese = mesi[parts[1]] || '01'; anno = parts[2];
  } else return str;
  return `${anno}-${mese}-${giorno.padStart(2,'0')}`;
}

function normalizeCampionato(camp) {
  // Mappa nomi nazione → nome campionato
  // NB: ITALIA non viene mappato — il campionato corretto (Serie A/B/C)
  // viene già dalla formula AS in VALUE_SCANNER tramite CAMP_ITA
  const MAP = {
    'BELGIO':'Jupiler Pro', 'TURCHIA':'Super Lig',
    'PORTOGALLO':'Primeira Liga',
    'INGHILTERRA':'Premier League', 'SPAGNA':'La Liga',
    'GERMANIA':'Bundesliga', 'FRANCIA':'Ligue 1',
    'ALTRO':'Altro',
  };
  return MAP[(camp||'').toUpperCase()] || camp;
}

function parseDataItaliana(str) {
  if (!str) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0,10);
  const mesi = {
    'GENNAIO':'01','FEBBRAIO':'02','MARZO':'03','APRILE':'04',
    'MAGGIO':'05','GIUGNO':'06','LUGLIO':'07','AGOSTO':'08',
    'SETTEMBRE':'09','OTTOBRE':'10','NOVEMBRE':'11','DICEMBRE':'12'
  };
  // Fix: Excel può troncare la stringa — "202" → "2026" (anno corrente)
  let s = str.toUpperCase().trim();
  s = s.replace(/\b(202)\b(?!\d)/g, '2026'); // "202" → "2026" se non seguito da cifra
  const parts = s.split(/\s+/);
  let giorno, mese, anno;
  if (parts.length >= 4) {
    giorno = parts[1]; mese = mesi[parts[2]]||'01'; anno = parts[3];
  } else if (parts.length >= 3) {
    giorno = parts[0]; mese = mesi[parts[1]]||'01'; anno = parts[2];
  } else return str;
  // Assicura anno 4 cifre
  if (anno && anno.length === 3) anno = anno + '6';
  if (!anno || anno.length < 4) anno = new Date().getFullYear().toString();
  return `${anno}-${mese}-${giorno.padStart(2,'0')}`;
}

function normalizeCampionato(camp) {
  const MAP = {
    'BELGIO':'Jupiler Pro','TURCHIA':'Super Lig',
    'PORTOGALLO':'Primeira Liga','ITALIA':'Serie A',
    'INGHILTERRA':'Premier League','SPAGNA':'La Liga',
    'GERMANIA':'Bundesliga','FRANCIA':'Ligue 1',
    'OLANDA':'Eredivisie','PAESI BASSI':'Eredivisie',
    'ALTRO':'Altro',
  };
  return MAP[(camp||'').toUpperCase()] || camp;
}

function adaptRow(m) {
  // Nomi colonne esatti da VALUE_SCANNER Excel
  // L=Odd1, M=OddX, N=Odd2 → "Odd1","OddX","Odd2" nel col_map
  // F=Prob1_mod, G=ProbX_mod, H=Prob2_mod → "Prob1","ProbX","Prob2"
  // BB=DECISION → "Decision"
  const odd1 = parseFloat(m.Odd1)  || parseFloat(m.Odd1_book) || 0;
  const oddx = parseFloat(m.OddX)  || parseFloat(m.OddX_book) || 0;
  const odd2 = parseFloat(m.Odd2)  || parseFloat(m.Odd2_book) || 0;
  const p1   = parseFloat(m.Prob1) || parseFloat(m.Prob1_mod) || null;
  const px   = parseFloat(m.ProbX) || parseFloat(m.ProbX_mod) || null;
  const p2   = parseFloat(m.Prob2) || parseFloat(m.Prob2_mod) || null;
  const lh   = parseFloat(m.lam_h) || null;
  const la   = parseFloat(m.lam_a) || null;
  const v1   = m.Value1  != null ? parseFloat(m.Value1)  : null;
  const vx   = m.ValueX  != null ? parseFloat(m.ValueX)  : null;
  const v2   = m.Value2  != null ? parseFloat(m.Value2)  : null;

  // Decision: usa Excel oppure calcola
  let dec = (m.Decision || m.DECISION || m.Segnale || '').replace('—','').trim();
  if (dec === 'BET' || dec === 'NO BET') {
    dec = dec === 'BET' ? 'BET' : 'SKIP';
  }
  if (!dec) {
    const vmax = Math.max(v1||0, vx||0, v2||0);
    dec = vmax > 0.05 ? 'BET' : vmax > 0 ? 'WATCH' : 'SKIP';
  }

  const campRaw = m.Campionato || m.League || '';
  const league  = normalizeCampionato(campRaw);

  return {
    id:         m.Match_ID || (m.Home + '_' + m.Away),
    home:       m.Home  || '',
    away:       m.Away  || '',
    league:     league,
    date:       parseDataItaliana(m.Date || ''),
    b365h: odd1, b365d: oddx, b365a: odd2,
    prob1: p1, probx: px, prob2: p2,
    lam_h: lh, lam_a: la,
    value1: v1, valuex: vx, value2: v2,
    decision:   dec,
    confidence: parseFloat(m.Confidence) || 0,
    kelly:      parseFloat(m.Kelly)      || 0,
    ov25:       parseFloat(m.Prob_OV25)  || null,
    probGG:     parseFloat(m.Prob_GG)    || null,
    stake:      parseFloat(m.Stake)      || 0,
    mercato:    m.Mercato || m.TipoScommessa || '',
    riskFlag:   m.RiskFlag || 'OK',
    oddOV25:    parseFloat(m.Odd_OV25)   || 0,
    oddGG:      parseFloat(m.Odd_GG)     || 0,
  };
}

function loadData() {
  // I dati sono iniettati direttamente da engine.py come variabile JS
  // Nessun server necessario — funziona con doppio click
  if (typeof LIVE_DATA !== 'undefined' && Array.isArray(LIVE_DATA) && LIVE_DATA.length > 0) {
    DEMO_DATA = LIVE_DATA.map(adaptRow).filter(m => m.home && m.away);
    const ts  = typeof DATA_TIMESTAMP !== 'undefined' ? DATA_TIMESTAMP : '';
    showStatus('✅ ' + DEMO_DATA.length + ' partite — ' + ts, 'ok');
    renderList();
  } else {
    // Nessun dato reale → mostra demo con avviso
    showStatus('⚠️  Nessun dato — lancia engine.py e riapri', 'warn');
    renderList();
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('status-bar');
  if (!el) return;
  el.textContent = msg;
  el.style.color = type === 'ok' ? 'var(--accent)' : type === 'warn' ? 'var(--yellow)' : 'var(--red)';
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

// Init
loadData();
buildLeagueChips();
