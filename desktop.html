<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progetto Pro — Match Scanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap');

:root {
  --bg:       #0a0d12;
  --surface:  #111520;
  --card:     #161c2a;
  --border:   #1f2a40;
  --accent:   #00d4aa;
  --accent2:  #f7b731;
  --accent3:  #e74c5e;
  --text:     #e8edf5;
  --muted:    #5a6580;
  --green:    #00d4aa;
  --yellow:   #f7b731;
  --red:      #e74c5e;
  --blue:     #4a9eff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  color: var(--accent);
  letter-spacing: -0.5px;
}
.logo span { color: var(--text); }
.header-stats {
  display: flex;
  gap: 20px;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--muted);
}
.header-stats b { color: var(--accent); }
.refresh-btn {
  background: var(--accent);
  color: #000;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 12px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.refresh-btn:hover { opacity: 0.85; }

/* ── Filtri ── */
.filters {
  display: flex;
  gap: 10px;
  padding: 16px 28px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  align-items: center;
}
.filter-label {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'DM Mono', monospace;
  margin-right: 4px;
}
.chip {
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Syne', sans-serif;
}
.chip:hover, .chip.active {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
}
.chip.top5-filter { border-color: rgba(247,183,49,.5); color: var(--yellow); }
.chip.top5-filter:hover, .chip.top5-filter.active { background: linear-gradient(90deg,#f7b731,#e74c5e); border-color: #f7b731; color: #000; }
.top5-section { margin-bottom: 24px; }
.top5-section-hdr { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; color: var(--yellow); text-transform: uppercase; letter-spacing: 2px; padding: 16px 0 10px; border-bottom: 1px solid rgba(247,183,49,.25); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.t5-card { background: linear-gradient(135deg, rgba(247,183,49,.06), rgba(231,76,94,.04)); border: 1px solid rgba(247,183,49,.3); border-radius: 10px; padding: 14px 16px; margin-bottom: 8px; position: relative; overflow: hidden; cursor: pointer; transition: all .18s; }
.t5-card:hover { border-color: rgba(247,183,49,.6); }
.t5-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, #f7b731, #e74c5e); }
.t5-rank { position: absolute; top: 12px; right: 14px; font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; color: rgba(247,183,49,.15); }
.t5-league { font-size: 10px; font-weight: 700; color: var(--yellow); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
.t5-teams { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 16px; margin-bottom: 10px; }
.t5-teams .vs { color: var(--muted); font-size: 11px; font-weight: 400; margin: 0 6px; }
.t5-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.t5-pill { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 4px; font-family: 'DM Mono', monospace; }
.t5-pill.merc { background: rgba(0,212,170,.15); color: var(--accent); }
.t5-pill.val { background: rgba(247,183,49,.15); color: var(--yellow); }
.t5-pill.conf { background: rgba(74,158,255,.15); color: var(--blue); }
.t5-pill.quota { background: rgba(231,76,94,.12); color: var(--red); }
.divider { width: 1px; height: 24px; background: var(--border); margin: 0 6px; }

/* ── STORICO TAB (desktop) ── */
.chip.storico-filter { border-color: rgba(74,158,255,.5); color: var(--blue); }
.chip.storico-filter:hover, .chip.storico-filter.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.sto-section { max-width: 900px; }
.sto-hdr { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; color: var(--blue); text-transform: uppercase; letter-spacing: 2px; padding: 16px 0 10px; border-bottom: 1px solid rgba(74,158,255,.25); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.sto-kpi4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
@media (max-width: 700px) { .sto-kpi4 { grid-template-columns: 1fr 1fr; } }
.sto-kbox { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
.sto-kbox.pos { border-color: rgba(0,212,170,.3); background: rgba(0,212,170,.04); }
.sto-kbox.neg { border-color: rgba(231,76,94,.3); background: rgba(231,76,94,.04); }
.sto-klbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.sto-kval { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; color: var(--text); }
.sto-kval.g { color: var(--accent); }
.sto-kval.r { color: var(--red); }
.sto-kval.b { color: var(--blue); }
.sto-kval.y { color: var(--yellow); }
.sto-ksub { font-size: 10px; color: var(--muted); margin-top: 4px; }
.sto-eqbox { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
.sto-eqttl { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.sto-eqcanvas { width: 100%; height: 140px; }
.sto-sec { font-family: 'Syne', sans-serif; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin: 20px 0 10px; display: flex; align-items: center; gap: 6px; }
.sto-sec::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.sto-res-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.sto-res-esito { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 11px; padding: 3px 9px; border-radius: 5px; flex-shrink: 0; min-width: 42px; text-align: center; }
.sto-res-esito.W { background: rgba(0,212,170,.2); color: var(--accent); }
.sto-res-esito.L { background: rgba(231,76,94,.15); color: var(--red); }
.sto-res-match { flex: 1; overflow: hidden; }
.sto-res-teams { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sto-res-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
.sto-res-pl { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; flex-shrink: 0; min-width: 64px; text-align: right; }
.sto-res-pl.g { color: var(--accent); }
.sto-res-pl.r { color: var(--red); }
.sto-res-pl.sim { opacity: .6; }
.sto-res-tipo { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; letter-spacing: .03em; text-transform: uppercase; }
.sto-res-tipo.BET { background: rgba(74,158,255,.15); color: var(--blue); }
.sto-res-tipo.WATCH { background: rgba(247,183,49,.15); color: var(--yellow); }
.sto-camp-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 16px; }
.sto-camp-tbl th { color: var(--muted); font-weight: 600; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
.sto-camp-tbl td { padding: 9px 10px; border-bottom: 1px solid rgba(31,42,64,.5); }
.sto-camp-tbl tr:hover td { background: rgba(255,255,255,.02); }
.sto-yld-pos { color: var(--accent); font-weight: 700; }
.sto-yld-neg { color: var(--red); font-weight: 700; }
.sto-bar-mini { display: inline-block; height: 5px; border-radius: 3px; vertical-align: middle; margin-left: 6px; }
.sto-footer-note { text-align: center; font-size: 10px; color: var(--muted); margin-top: 16px; padding-bottom: 10px; }

/* ── Layout principale ── */
.main {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 0;
  height: calc(100vh - 120px);
}
.match-list { overflow-y: auto; padding: 20px 28px; }
.preview-panel {
  border-left: 1px solid var(--border);
  background: var(--surface);
  overflow-y: auto;
  position: sticky;
  top: 120px;
  height: calc(100vh - 120px);
}

/* ── Match card ── */
.day-header {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 16px 0 8px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.match-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.match-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.18s;
}
.match-card:hover { border-color: var(--accent); }
.match-card:hover::before { background: var(--accent); }
.match-card.selected { border-color: var(--accent); background: #0d1824; }
.match-card.selected::before { background: var(--accent); }
.match-card.has-value::before { background: var(--yellow) !important; }
.match-card.has-value { border-color: #2a2510; }

.match-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}
.match-teams {
  font-family: 'Syne', sans-serif;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}
.match-teams .vs {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
  margin: 0 6px;
  font-family: 'DM Mono', monospace;
}
.match-meta {
  display: flex;
  gap: 8px;
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-bottom: 6px;
  align-items: center;
}
.league-badge {
  background: var(--border);
  color: var(--text);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  font-family: 'Syne', sans-serif;
}

/* ── Quote row ── */
.odds-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 10px;
}
.odd-box {
  text-align: center;
  background: var(--bg);
  border-radius: 6px;
  padding: 6px 4px;
  border: 1px solid var(--border);
  transition: all 0.15s;
}
.odd-box.bet {
  background: rgba(0,212,170,0.12);
  border-color: var(--accent);
}
.odd-label {
  font-size: 10px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  display: block;
  margin-bottom: 2px;
}
.odd-value {
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
}
.odd-box.bet .odd-value { color: var(--accent); }
/* 13/10/2026: quota giusta Pinnacle sotto la quota PlanetWin */
.pin-sub { display:block; font-size:10px; color:var(--muted); margin-top:2px; }
.value-badge {
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  background: rgba(247,183,49,0.15);
  color: var(--yellow);
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  display: block;
  margin-top: 2px;
}
.value-badge.positive { background: rgba(0,212,170,0.15); color: var(--accent); }

/* ── Preview Panel ── */
.preview-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--muted);
  gap: 12px;
  text-align: center;
  padding: 40px;
}
.preview-placeholder .icon { font-size: 48px; opacity: 0.3; }
.preview-placeholder p { font-size: 14px; line-height: 1.6; }

.preview-content { padding: 24px 20px; }
.preview-title {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  margin-bottom: 4px;
  line-height: 1.2;
}
.preview-sub {
  font-size: 12px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-bottom: 20px;
}

/* ── Prob bars ── */
.section-title {
  font-family: 'Syne', sans-serif;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--muted);
  margin: 20px 0 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.prob-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.prob-label {
  font-size: 12px;
  color: var(--muted);
  width: 90px;
  flex-shrink: 0;
}
.prob-bar-wrap {
  flex: 1;
  background: var(--border);
  border-radius: 4px;
  height: 7px;
  overflow: hidden;
}
.prob-bar {
  height: 100%;
  border-radius: 4px;
  background: var(--accent);
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}
.prob-bar.amber { background: var(--yellow); }
.prob-bar.red   { background: var(--red); }
.prob-bar.blue  { background: var(--blue); }
.prob-pct {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  width: 44px;
  text-align: right;
  color: var(--text);
}
.fair-odds {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  width: 52px;
  text-align: right;
}
.value-chip {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  font-family: 'DM Mono', monospace;
  font-weight: 500;
  min-width: 48px;
  text-align: center;
}
.value-chip.pos { background: rgba(0,212,170,0.15); color: var(--accent); }
.value-chip.neg { background: rgba(231,76,94,0.12); color: var(--red); }
.value-chip.none { opacity: 0; }

/* ── Lambda box ── */
.lambda-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 0;
}
.lambda-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  text-align: center;
}
.lambda-team {
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lambda-value {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 28px;
  color: var(--accent);
}
.lambda-label {
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
}

/* ── Over/Under ── */
.ou-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin: 4px 0;
}
.ou-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px;
  text-align: center;
}
.ou-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }
.ou-pct { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; }
.ou-fair { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; }

/* ── Decision badge ── */
.decision-row {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.decision-badge {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
}
.decision-badge.bet   { background: rgba(0,212,170,0.15); border: 1px solid var(--accent); color: var(--accent); }
.decision-badge.watch { background: rgba(247,183,49,0.12); border: 1px solid var(--yellow); color: var(--yellow); }
.decision-badge.skip  { background: rgba(90,101,128,0.12); border: 1px solid var(--border); color: var(--muted); }
.decision-badge .sub  { font-size: 10px; font-weight: 400; display: block; margin-top: 2px; font-family: 'DM Mono', monospace; }

/* ── Confidence bar ── */
.conf-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 8px 0;
}
.conf-bar-wrap { flex: 1; background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; }
.conf-bar { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--blue)); }
.conf-label { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
.conf-value { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 14px; color: var(--text); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Animazioni ── */
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.match-card { animation: fadeIn 0.25s ease both; }
.preview-content { animation: fadeIn 0.3s ease both; }

/* ── Mobile ── */
@media (max-width: 768px) {
  .main { grid-template-columns: 1fr; height: auto; }
  .preview-panel { position: fixed; bottom: 0; left: 0; right: 0; height: 60vh; z-index: 200;
    border-left: none; border-top: 1px solid var(--border); transform: translateY(100%); transition: transform 0.3s; }
  .preview-panel.open { transform: translateY(0); }
  .match-list { padding-bottom: 80px; }
  .header-stats { display: none; }
}

/* ── NUOVE SEZIONI: ora, score_probs, forma ── */
.ora-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(74,158,255,.1);
  border:1px solid rgba(74,158,255,.25);border-radius:4px;padding:2px 8px;
  font-size:10px;font-weight:600;color:#4a9eff;font-family:'DM Mono',monospace;}
.scores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.score-chip{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:10px 6px;text-align:center;}
.score-chip.top1{border-color:var(--accent);background:rgba(0,212,170,.06);}
.score-res{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;}
.score-pct{font-size:10px;color:var(--muted);margin-top:2px;}
.score-esito{font-size:9px;font-weight:700;margin-top:2px;}
.score-esito.e1{color:var(--accent);}.score-esito.eX{color:#f7b731;}.score-esito.e2{color:var(--red);}
.consiglio-box{margin-top:4px;margin-bottom:4px;padding:10px 14px;border-radius:8px;
  background:linear-gradient(135deg,rgba(0,212,170,.08),rgba(74,158,255,.05));
  border:1px solid rgba(0,212,170,.3);display:flex;align-items:center;gap:10px;}
.consiglio-box.neutro{background:var(--bg);border-color:var(--border);}
.consiglio-icon{font-size:18px;flex-shrink:0;}
.consiglio-testo{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--text);line-height:1.3;}
.consiglio-box.neutro .consiglio-testo{font-weight:500;color:var(--muted);font-family:'DM Sans',sans-serif;}
.forma-wrap{margin-bottom:10px;}
.forma-lbl{font-size:10px;color:var(--muted);margin-bottom:6px;font-family:'DM Mono',monospace;}
.forma-pills{display:flex;gap:8px;flex-wrap:wrap;}
.fp{display:flex;flex-direction:column;align-items:center;gap:3px;}
.fpp{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;

.fpp.W{background:rgba(0,212,170,.15);color:var(--accent);border:1px solid rgba(0,212,170,.3);}
.fpp.D{background:rgba(247,183,49,.12);color:#f7b731;border:1px solid rgba(247,183,49,.3);}
.fpp.L{background:rgba(231,76,94,.12);color:var(--red);border:1px solid rgba(231,76,94,.3);}

.fo{font-size:8px;color:var(--muted);max-width:38px;overflow:hidden;

</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">Progetto<span>Pro</span> <span style="color:var(--muted);font-size:11px;font-weight:400;font-family:'DM Mono',monospace;">Ver28</span></div>
  <div class="header-stats">
    <span>Palinsesto: <b id="total-matches">0</b> partite</span>
    <span>BET: <b id="total-bets" style="color:var(--accent)">0</b></span>
    <span>WATCH: <b id="total-watch" style="color:var(--yellow)">0</b></span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="status-bar" style="font-family:'DM Mono',monospace;font-size:11px;display:none;"></span>
    <button class="refresh-btn" onclick="loadData()">⟳ Aggiorna</button>
  </div>
</div>

<!-- Filtri -->
<div class="filters" id="league-filters">
  <span class="filter-label">Campionato:</span>
  <button class="chip active" id="chip-all" onclick="filterLeague('')">Tutti</button>
  <!-- Bottoni campionato generati dinamicamente da buildLeagueChips() -->
  <div class="divider"></div>
  <button class="chip value-filter" onclick="filterValue()">Solo VALUE+</button>
  <button class="chip value-filter" onclick="filterBet()">Solo BET</button>
  <button class="chip top5-filter" id="chip-top5" onclick="filterTop5()">★ TOP 5</button>
  <button class="chip storico-filter" id="chip-storico" onclick="filterStorico()">📊 Storico</button>
  <button class="chip storico-filter" id="chip-schedina" onclick="filterSchedina()">📋 Schedina</button>
  <button class="chip storico-filter" id="chip-pronostici" onclick="filterPronostici()">🎯 Pronostici</button>
</div>
<div class="filters" id="date-filters" style="padding-top:0;">
  <span class="filter-label">Giorno:</span>
  <button class="chip active" id="chip-date-all" onclick="clearDateFilter()">Tutte</button>
  <button class="chip" id="chip-date-pick" onclick="openDatePicker()">📅</button>
  <span id="date-lbl" style="font-size:11px;color:var(--muted)"></span>
  <input type="date" id="date-input" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;" onchange="dateChosen(this.value)">
</div>

<!-- Main -->
<div class="main">
  <div class="match-list" id="match-list">
    <!-- Cards iniettate da JS -->
  </div>
  <div class="preview-panel" id="preview-panel">
    <div class="preview-placeholder" id="preview-placeholder">
      <div class="icon">⚽</div>
      <p>Seleziona una partita<br>per vedere l'analisi completa</p>
    </div>
    <div class="preview-content" id="preview-content" style="display:none"></div>
  </div>
</div>

<script>

</script>

<script>
// ══════════════════════════════════════════════════════════════════
// DATI — In produzione questi arrivano da VALUE_SCANNER Excel
// tramite VBA (macro legge foglio e scrive JSON) o da Python
// Per la demo usiamo dati realistici basati sul tuo sistema
// ══════════════════════════════════════════════════════════════════

let DEMO_DATA = []
let currentFilter = '';
let valueOnly = false;
let betOnly = false;
let top5Only = false;
let storicoOnly = false;
let schedinaOnly = false;
let pronosticiOnly = false;   // 13/10/2026
let dateFilter = '';
let selectedId = null;

function computeOverUnder(lh, la) {
  const tot = lh + la;
  return {
    ov05: 1 - Math.exp(-tot),
    ov15: 1 - Math.exp(-tot) * (1 + tot),
    ov25: 1 - Math.exp(-tot) * (1 + tot + tot*tot/2),
    ov35: 1 - Math.exp(-tot) * (1 + tot + tot*tot/2 + Math.pow(tot,3)/6),
    gg: (1-Math.exp(-lh)) * (1-Math.exp(-la)),
  };
}

function pct(v) { return (v != null && !isNaN(v)) ? (v*100).toFixed(1)+'%' : '—'; }
function fair(p) { return (p != null && !isNaN(p) && p > 0.01) ? (1/p).toFixed(2) : '—'; }

function valueChip(v) {
  if (v === null || v === undefined) return '<span class="value-chip none">—</span>';
  const cls = v > 0 ? 'pos' : 'neg';
  const sign = v > 0 ? '+' : '';
  return `<span class="value-chip ${cls}">${sign}${(v*100).toFixed(1)}%</span>`;
}

function renderCard(m, idx) {
  const isBet   = m.decision === 'BET';
  const isWatch = m.decision === 'WATCH';
  // hasValue: considera anche quando value è nullo ma odds ci sono
  const hasOdds = m.b365h > 1 || m.b365d > 1 || m.b365a > 1;
  const hasValue = (m.value1||0) > 0 || (m.valuex||0) > 0 || (m.value2||0) > 0;

  const bestValue = Math.max(m.value1||0, m.valuex||0, m.value2||0);
  const bestMkt = bestValue === m.value1 ? '1' : bestValue === m.valuex ? 'X' : '2';

  const decBadge = isBet
    ? `<span style="background:rgba(0,212,170,0.2);color:var(--accent);padding:3px 8px;border-radius:4px;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;">⚡ BET ${bestMkt}</span>`
    : isWatch
    ? `<span style="background:rgba(247,183,49,0.15);color:var(--yellow);padding:3px 8px;border-radius:4px;font-size:10px;font-family:'Syne',sans-serif;font-weight:700;">👁 WATCH</span>`
    : '';

  return `
  <div class="match-card ${hasValue?'has-value':''} ${selectedId===m.id?'selected':''}"
       data-id="${m.id}"
       onclick="selectMatch('${m.id}')"
       style="animation-delay:${idx*0.04}s">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <div>
        ${nazOfDesk(m.league)?`<div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.45;margin-bottom:2px;">${nazOfDesk(m.league)}</div>`:''}
        <span class="league-badge" style="${
        m.league==='Serie A'?'background:#1a3a5c;color:#4a9eff':
        m.league==='Serie B'?'background:#1a3a2a;color:#00d4aa':
        m.league==='Serie C'?'background:#2a2a1a;color:#f7b731':
        m.league==='Premier League'?'background:#1a0a2a;color:#a855f7':
        m.league==='La Liga'?'background:#3a1a1a;color:#e74c5e':
        m.league==='Bundesliga'?'background:#2a1a0a;color:#f97316':
        m.league==='Bundesliga 2'?'background:#1a0f00;color:#f59e0b':
        m.league==='Eredivisie'?'background:#001a0a;color:#10b981':
        m.league==='Jupiler Pro'?'background:#0a1a2a;color:#4a9eff':
        ''}">${lnmOfDesk(m.league)}${m.ora?' - '+m.ora:''}</span>
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-left:8px;">${m.date}</span>
      </div>
      ${decBadge}
    </div>
    <div class="match-teams">${m.home} <span class="vs">vs</span> ${m.away}</div>
    <div class="odds-row">
      <div class="odd-box ${(m.value1||0)>0?'bet':(m.b365h>0&&m.b365h<1.5?'low':'')}">
        <span class="odd-label">1 Casa</span>
        <span class="odd-value">${m.b365h>0?m.b365h.toFixed(2):'—'}</span>${m.pin1?`<span class="pin-sub">Pin ${m.pin1.toFixed(2)}</span>`:''}
        ${(m.value1!=null)?`<span class="value-badge ${m.value1>0?'positive':'negative'}">${m.value1>0?'+':''}${(m.value1*100).toFixed(1)}%</span>`:''}
      </div>
      <div class="odd-box ${(m.valuex||0)>0?'bet':''}">
        <span class="odd-label">X Pareggio</span>
        <span class="odd-value">${m.b365d>0?m.b365d.toFixed(2):'—'}</span>${m.pinx?`<span class="pin-sub">Pin ${m.pinx.toFixed(2)}</span>`:''}
        ${(m.valuex!=null)?`<span class="value-badge ${m.valuex>0?'positive':'negative'}">${m.valuex>0?'+':''}${(m.valuex*100).toFixed(1)}%</span>`:''}
      </div>
      <div class="odd-box ${(m.value2||0)>0?'bet':''}">
        <span class="odd-label">2 Ospite</span>
        <span class="odd-value">${m.b365a>0?m.b365a.toFixed(2):'—'}</span>${m.pin2?`<span class="pin-sub">Pin ${m.pin2.toFixed(2)}</span>`:''}
        ${(m.value2!=null)?`<span class="value-badge ${m.value2>0?'positive':'negative'}">${m.value2>0?'+':''}${(m.value2*100).toFixed(1)}%</span>`:''}
      </div>
    </div>
  </div>`;
}

function renderList() {
  const list = document.getElementById('match-list');
  if (top5Only) { list.innerHTML = renderTop5Section(); return; }
  if (storicoOnly) { list.innerHTML = renderStoricoSection(); return; }
  if (schedinaOnly) { list.innerHTML = renderSchedinaSection(); return; }
  if (pronosticiOnly) { list.innerHTML = renderPronosticiSection(); return; }
  let filtered = DEMO_DATA.filter(m => {
    if (!m.home || !m.away) return false;
    if (currentFilter && m.league !== currentFilter) return false;
    if (dateFilter && m.date !== dateFilter) return false;
    if (valueOnly && (m.value1||0) <= 0 && (m.valuex||0) <= 0 && (m.value2||0) <= 0) return false;
    if (betOnly && m.decision !== 'BET') return false;
    return true;
  });

  // Raggruppa per data
  const byDate = {};
  filtered.forEach(m => { (byDate[m.date] = byDate[m.date]||[]).push(m); });

  const bets  = filtered.filter(m=>m.decision==='BET').length;
  const watch = filtered.filter(m=>m.decision==='WATCH').length;
  document.getElementById('total-matches').textContent = filtered.length;
  document.getElementById('total-bets').textContent    = bets;
  document.getElementById('total-watch').textContent   = watch;

  let html = '';
  let cardIdx = 0;
  for (const date of Object.keys(byDate).sort()) {
    const todayISO = new Date().toISOString().slice(0,10);
    let label = date;
    if (date === todayISO) {
      label = 'Oggi';
    } else if (date) {
      try {
        const d = new Date(date + 'T12:00:00');
        label = d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
        label = label.charAt(0).toUpperCase() + label.slice(1);
      } catch(e) { label = date; }
    }
    html += `<div class="day-header">${label} — ${byDate[date].length} partite</div>`;
    html += byDate[date].map(m => renderCard(m, cardIdx++)).join('');
  }

  if (!html) html = `<div style="padding:40px;text-align:center;color:var(--muted);">
    <div style="font-size:32px;margin-bottom:12px;">🔍</div>
    <p>Nessuna partita con questi filtri</p>
  </div>`;

  list.innerHTML = html;
}

function selectMatch(id) {
  selectedId = id;

  // Trova la partita
  const m = DEMO_DATA.find(x => x.id === id);
  if (!m) { console.warn('Partita non trovata:', id); return; }

  // Evidenzia la card selezionata
  document.querySelectorAll('.match-card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector('[data-id="' + id + '"]');
  if (card) card.classList.add('selected');

  // Calcola Over/Under da lambda (se disponibile)
  const hasLambda = (m.lam_h != null && m.lam_a != null && !isNaN(m.lam_h));
  const ou = hasLambda ? computeOverUnder(m.lam_h, m.lam_a) : null;

  const conf = parseFloat(m.confidence) || 0;
  const decClass = m.decision === 'BET' ? 'bet' : m.decision === 'WATCH' ? 'watch' : 'skip';
  const decLabel = m.decision === 'BET' ? '⚡ BET' : m.decision === 'WATCH' ? '👁 WATCH' : '⛔ SKIP';

  // Helper locali null-safe
  const _pct  = v => (v != null && !isNaN(v)) ? (v * 100).toFixed(1) + '%' : '—';
  const _fair = p => (p != null && !isNaN(p) && p > 0.01) ? (1/p).toFixed(2) : '—';
  const _val  = v => {
    if (v == null) return '';
    const cls = v > 0 ? 'positive' : 'negative';
    const sign = v > 0 ? '+' : '';
    return `<span class="value-badge ${cls}">${sign}${(v*100).toFixed(1)}%</span>`;
  };
  const _odd  = v => (v && v > 1) ? v.toFixed(2) : '—';

  // Costruisci HTML pannello
  const panelHTML = `
    <div style="padding:16px 20px;border-bottom:1px solid var(--border);
                display:flex;align-items:center;justify-content:space-between;">
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:10px;
                    color:var(--muted);margin-bottom:4px;display:flex;align-items:center;gap:8px;">
          ${m.league} · ${m.date}
          ${m.ora ? `<span class="ora-badge">⏰ ${m.ora}</span>` : ''}
        </div>
        <div style="font-family:'Syne',sans-serif;font-weight:800;
                    font-size:16px;line-height:1.3;">${m.home}<br>
          <span style="color:var(--muted);font-size:12px;font-weight:400;">vs</span>
          ${m.away}
        </div>
      </div>
      <div class="decision-badge ${decClass}" style="padding:8px 14px;">
        ${decLabel}
        <span class="sub">conf. ${(conf*100).toFixed(0)}%</span>
      </div>
    </div>

    <div style="padding:16px 20px;">

      <!-- QUOTE BOOKMAKER -->
      <div class="section-title">📋 Quote bookmaker</div>
      <div class="odds-row" style="margin-bottom:16px;">
        <div class="odd-box ${(m.value1||0)>0?'bet':''}">
          <span class="odd-label">1 Casa</span>
          <span class="odd-value">${_odd(m.b365h)}</span>
          ${m.pin1?`<span class="pin-sub">Pinnacle giusta ${m.pin1.toFixed(2)}</span>`:''}
          ${_val(m.value1)}
        </div>
        <div class="odd-box ${(m.valuex||0)>0?'bet':''}">
          <span class="odd-label">X Pareggio</span>
          <span class="odd-value">${_odd(m.b365d)}</span>
          ${m.pinx?`<span class="pin-sub">Pinnacle giusta ${m.pinx.toFixed(2)}</span>`:''}
          ${_val(m.valuex)}
        </div>
        <div class="odd-box ${(m.value2||0)>0?'bet':''}">
          <span class="odd-label">2 Ospite</span>
          <span class="odd-value">${_odd(m.b365a)}</span>
          ${m.pin2?`<span class="pin-sub">Pinnacle giusta ${m.pin2.toFixed(2)}</span>`:''}
          ${_val(m.value2)}
        </div>
      </div>
      ${m.mk ? `<div class="section-title">🏦 Mercato</div><div style="margin-bottom:16px;">${_mkTable(m.mk, 12)}</div>` : ''}
      ${(m.pron && m.pron.length) ? `<div class="section-title">🎯 Pronostici</div><div style="margin-bottom:16px;">${_proBlocco(m.pron, 12)}</div>` : ''}

      <!-- LAMBDA -->
      ${hasLambda ? `
      <div class="section-title">⚽ Gol attesi (λ)</div>
      <div class="lambda-grid">
        <div class="lambda-box">
          <div class="lambda-team">${m.home}</div>
          <div class="lambda-value">${m.lam_h.toFixed(2)}</div>
          <div class="lambda-label">λ Casa</div>
        </div>
        <div class="lambda-box">
          <div class="lambda-team">${m.away}</div>
          <div class="lambda-value">${m.lam_a.toFixed(2)}</div>
          <div class="lambda-label">λ Ospite</div>
        </div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--muted);
                  font-family:'DM Mono',monospace;margin:4px 0 12px;">
        Media gol attesi: <b style="color:var(--text)">${(m.lam_h+m.lam_a).toFixed(2)}</b>
      </div>` : `
      <div style="padding:8px 12px;background:var(--border);border-radius:6px;
                  font-size:11px;color:var(--muted);text-align:center;margin-bottom:12px;">
        λ non disponibile — lancia engine.py per calcolare le probabilità
      </div>`}

      <!-- CONFIDENCE -->
      ${conf > 0 ? `
      <div class="section-title">📊 Confidence</div>
      <div class="conf-row">
        <span class="conf-label">Confidence</span>
        <div class="conf-bar-wrap">
          <div class="conf-bar" style="width:${Math.min(conf*100,100).toFixed(0)}%"></div>
        </div>
        <span class="conf-value">${(conf*100).toFixed(0)}%</span>
      </div>
      ${(m.kelly > 0) ? `
      <div class="conf-row">
        <span class="conf-label">Kelly stake</span>
        <div class="conf-bar-wrap">
          <div class="conf-bar" style="width:${Math.min(m.kelly*500,100)}%;
               background:var(--yellow);"></div>
        </div>
        <span class="conf-value" style="color:var(--yellow);">
          ${(m.kelly*100).toFixed(1)}%
        </span>
      </div>` : ''}` : ''}

      <!-- PROBABILITA 1X2 -->
      ${(m.prob1 != null) ? `
      <div class="section-title">🎯 Probabilità 1X2 (modello Dixon-Coles)</div>
      <div class="prob-row">
        <span class="prob-label">1 — Casa</span>
        <div class="prob-bar-wrap">
          <div class="prob-bar" style="width:${_pct(m.prob1)}"></div>
        </div>
        <span class="prob-pct">${_pct(m.prob1)}</span>
        <span class="fair-odds">Fair ${_fair(m.prob1)}</span>
        ${_val(m.value1)}
      </div>
      <div class="prob-row">
        <span class="prob-label">X — Pareggio</span>
        <div class="prob-bar-wrap">
          <div class="prob-bar amber" style="width:${_pct(m.probx)}"></div>
        </div>
        <span class="prob-pct">${_pct(m.probx)}</span>
        <span class="fair-odds">Fair ${_fair(m.probx)}</span>
        ${_val(m.valuex)}
      </div>
      <div class="prob-row">
        <span class="prob-label">2 — Ospite</span>
        <div class="prob-bar-wrap">
          <div class="prob-bar red" style="width:${_pct(m.prob2)}"></div>
        </div>
        <span class="prob-pct">${_pct(m.prob2)}</span>
        <span class="fair-odds">Fair ${_fair(m.prob2)}</span>
        ${_val(m.value2)}
      </div>` : ''}

      <!-- OVER/UNDER -->
      ${ou ? `
      <div class="section-title">📈 Over / Under</div>
      <div class="ou-grid">
        <div class="ou-box">
          <div class="ou-label">Over 0.5</div>
          <div class="ou-pct" style="color:var(--accent)">${_pct(ou.ov05)}</div>
          <div class="ou-fair">Fair ${_fair(ou.ov05)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">Over 1.5</div>
          <div class="ou-pct" style="color:var(--accent)">${_pct(ou.ov15)}</div>
          <div class="ou-fair">Fair ${_fair(ou.ov15)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">Over 2.5</div>
          <div class="ou-pct" style="color:var(--blue)">${_pct(ou.ov25)}</div>
          <div class="ou-fair">Fair ${_fair(ou.ov25)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">Over 3.5</div>
          <div class="ou-pct" style="color:var(--yellow)">${_pct(ou.ov35)}</div>
          <div class="ou-fair">Fair ${_fair(ou.ov35)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">GG</div>
          <div class="ou-pct" style="color:var(--accent)">${_pct(ou.gg)}</div>
          <div class="ou-fair">Fair ${_fair(ou.gg)}</div>
        </div>
        <div class="ou-box">
          <div class="ou-label">NG</div>
          <div class="ou-pct" style="color:var(--red)">${_pct(1-ou.gg)}</div>
          <div class="ou-fair">Fair ${_fair(1-ou.gg)}</div>
        </div>
      </div>` : ''}

      <!-- RISULTATI ESATTI -->
      ${(m.score_probs && m.score_probs.length) ? `
      <div class="section-title" style="margin-top:16px;">🎲 Risultati esatti più probabili</div>
      <div class="scores-grid">
        ${m.score_probs.slice(0,6).map((s,i) => `
          <div class="score-chip ${i===0?'top1':''}">
            <div class="score-res">${s.score}</div>
            <div class="score-pct">${s.prob}%</div>
            <div class="score-esito ${s.esito==='1'?'e1':s.esito==='X'?'eX':'e2'}">${s.esito}</div>
          </div>`).join('')}
      </div>` : ''}

      <!-- CONSIGLIO -->
      ${m.consiglio ? `
      <div class="consiglio-box ${m.consiglio.startsWith('Equilibrio')?'neutro':''}">
        <span class="consiglio-icon">${m.consiglio.startsWith('Equilibrio')?'⚖️':'💡'}</span>
        <span class="consiglio-testo">${m.consiglio}</span>
      </div>` : ''}

      <!-- FORMA RECENTE -->
      ${((m.forma_home && m.forma_home.length) || (m.forma_away && m.forma_away.length)) ? `
      <div class="section-title" style="margin-top:16px;">📊 Forma recente</div>
      ${m.forma_home && m.forma_home.length ? `
      <div class="forma-wrap">
        <div class="forma-lbl">🏠 ${m.home} — ultimi 5</div>
        <div class="forma-pills">
          ${m.forma_home.slice(0,5).map(f => `
            <div class="fp">
              <div class="fpp ${f.ris}">${f.ris}</div>
              <div class="fs">${f.gf}-${f.gs}</div>
              <div class="fo">${f.opp||''}</div>
            </div>`).join('')}
        </div>
      </div>` : ''}
      ${m.forma_away && m.forma_away.length ? `
      <div class="forma-wrap">
        <div class="forma-lbl">✈️ ${m.away} — ultimi 5</div>
        <div class="forma-pills">

function buildLeagueChips() {
  // Conta partite per campionato nei dati live
  // normalizza il nome (es. "SVEZIA" → "Allsvenskan") prima di contare
  const counts = {};
  (window.LIVE_DATA || []).forEach(r => {
    const c = (IRL_TEAMS_DESK.has(r.Home||'') || IRL_TEAMS_DESK.has(r.Away||'')) ? 'League of Ireland' : normalizeCampionato(r.Campionato || '');
    counts[c] = (counts[c] || 0) + 1;
  });

  const container = document.getElementById('league-filters');
  if (!container) return;

  // Rimuovi solo chip campionato (non chip-all, non value-filter, non top5-filter)
  container.querySelectorAll('.chip:not(#chip-all):not(.value-filter):not(.top5-filter):not(.storico-filter)').forEach(b => {

  });
  const divider = container.querySelector('.divider');

  const total = (window.LIVE_DATA || []).length;
  const chipAll = document.getElementById('chip-all');
  if (chipAll) chipAll.textContent = `Tutti (${total})`;

  // Crea un bottone per ogni campionato che ha almeno 1 partita
  LEAGUE_CONFIG.forEach(cfg => {

function buildSchedinaBlockDesk(titolo, icona, todayStr, pickFn) {
  // FIX 21/09/2026: vedi nota gemella in buildSchedinaBlock() (mobile) —
  // stessa correzione: soglia minima di Confidence (SOGLIA_CONFIDENCE=0.55
  // in engine.py) per entrare in schedina, e score ribilanciato a favore
  // della Confidence invece che di Value%/EV (che cresce meccanicamente
  // con la quota indipendentemente da un edge reale).
  const SOGLIA_CONFIDENCE_SCHEDINA = 0.55;
  const cand = DEMO_DATA.filter(m => m.date === todayStr && m.home && m.away && m.decision !== 'SKIP').map(m => {
    const opt = pickFn(m);
    if (!opt) return null;
    const score = (opt.p||0)*0.50 + (opt.v||0)*0.30 + (m.confidence||0)*0.20;
    return { m, best: opt, score };
  }).filter(Boolean);
  const betOnly = cand.filter(c => c.m.decision === 'BET').sort((a,b) => b.score - a.score);
  const watchOnly = cand.filter(c => c.m.decision !== 'BET').sort((a,b) => b.score - a.score);
  const scelte = [...betOnly, ...watchOnly].slice(0, 3);

  let h = `<div class="sto-hdr" style="margin-top:26px;"><span>${icona}</span> ${titolo}</div>`;
  if (!scelte.length) {
    h += '<p style="color:var(--muted);padding:20px;font-size:13px">🔍 Nessun segnale sufficiente oggi per questo mercato.</p>';
    return h;
  }
  if (scelte.length < 3) {
    h += `<div style="font-size:12px;color:var(--yellow);background:rgba(247,183,49,.08);border:1px solid rgba(247,183,49,.25);border-radius:8px;padding:10px 14px;margin-bottom:16px;">⚠️ Solo ${scelte.length} partit${scelte.length===1?'a':'e'} disponibil${scelte.length===1?'e':'i'} oggi con segnale sufficiente — proposta ridotta, non a 3 selezioni.</div>`;
  }
  let comboOdd = 1, comboProb = 1;
  h += '<div style="display:grid;gap:12px;margin-bottom:16px;">';
  scelte.forEach(c => {
    comboOdd *= c.best.o; comboProb *= (c.best.p || 0);
    h += `<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;">`;
    h += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">${c.m.league}${c.m.ora?' · '+c.m.ora:''}</span><span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:${c.m.decision==='BET'?'rgba(0,212,170,.15);color:var(--accent)':'rgba(247,183,49,.15);color:var(--yellow)'}">${c.m.decision==='BET'?'⚡ BET':'👁 WATCH'}</span></div>`;
    if (c.m.formaAlert) h += `<div style="display:inline-block;font-size:10px;font-weight:700;color:var(--yellow);background:rgba(247,183,49,.12);border:1px solid rgba(247,183,49,.35);border-radius:6px;padding:2px 8px;margin-bottom:6px;">⚠️ FORMA ALERT — forma recente in contrasto col modello</div>`;
    h += `<div style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;margin-bottom:10px;">${c.m.home} <span style="color:var(--muted);font-weight:400;">vs</span> ${c.m.away}</div>`;
    h += `<div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);">`;
    h += `<div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Esito consigliato</div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--accent);">${c.best.lbl}</div></div>`;
    h += `<div style="text-align:right;"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Quota</div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:18px;">${c.best.o.toFixed(2)}</div></div>`;
    h += `</div></div>`;
  });
  h += '</div>';
  const stakeTot = 5, vincita = (stakeTot * comboOdd).toFixed(2);
  h += `<div style="background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:20px;max-width:420px;">`;
  h += `<div style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--accent);margin-bottom:14px;">🎟️ Riepilogo Multipla (${scelte.length} eventi)</div>`;
  h += `<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="font-size:12px;color:var(--muted);">Quota combinata</span><span style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;">${comboOdd.toFixed(2)}</span></div>`;
  h += `<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="font-size:12px;color:var(--muted);">Probabilità reale stimata</span><span style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px;">${(comboProb*100).toFixed(1)}%</span></div>`;
  h += `<div style="display:flex;justify-content:space-between;margin-bottom:8px;"><span style="font-size:12px;color:var(--muted);">Puntata suggerita</span><span style="font-family:'Syne',sans-serif;font-weight:700;font-size:14px;">€${stakeTot.toFixed(2)}</span></div>`;
  h += `<div style="display:flex;justify-content:space-between;"><span style="font-size:12px;color:var(--muted);">Vincita potenziale</span><span style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent);">€${vincita}</span></div>`;
  h += `</div>`;
  h += `<div style="font-size:11px;color:var(--muted);line-height:1.6;margin-top:14px;max-width:420px;">⚠️ ${scelte.length} eventi combinati in un'unica giocata: il rischio è più alto della somma dei singoli — basta un esito sbagliato per perdere l'intera schedina. La probabilità reale stimata sopra riflette questo, non farti guidare solo dalla quota.</div>`;
  return h;
}
// FIX Schedina: stesso range quota di SOGLIA_QUOTA_MIN/MAX in engine.py (1.40-6.00).
// Prima la Schedina sceglieva il mercato con Value% più alto tra 1/X/2 SENZA
// controllare la quota — un Value% enorme su una quota fuori range (tipicamente
// un risultato estremo su un campionato data-sparse) batteva un mercato valido,
// mostrando un "Esito Consigliato" che l'engine Python aveva già scartato.
// FIX 12/10/2026: la Schedina sceglieva tra 1/X/2 l'esito con Value% piu' alto.
// Value% = p*quota-1 cresce con la quota e Dixon-Coles sovrastima le sfavorite
// -> pick sistematici su sfavorite (es. Alverca 4.55 al 25%). Ora: quota max 3.00,
// probabilita' minima esito 45%, tra gli esiti con value>0 si sceglie il PIU'
// PROBABILE, score calcolato sull'esito (prob 50% + value 30% + confidence 20%).
// FORMA_ALERT mostrato come badge sulla card (non escluso).
// FIX 12/10/2026 (2): la Schedina usa la STESSA base della decisione engine:
// Value1/X/2, Value_GG, Value_OV25 ora sono calcolati sulla probabilita' ibrida
// (modello+mercato) e le partite SKIP sono escluse. La probabilita' usata per
// filtro/score/probabilita' combinata e' quella ibrida (Prob*_ibr).
const SCH_QUOTA_MIN = 1.40, SCH_QUOTA_MAX = 3.00, SCH_PROB_MIN = 0.45;

function renderSchedinaSection() {
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  let oggiLbl = now.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
  oggiLbl = oggiLbl.charAt(0).toUpperCase() + oggiLbl.slice(1);

  let h = '<div class="sto-section">';
  h += `<div class="sto-hdr"><span>📋</span> Schedina del giorno — ${oggiLbl}</div>`;

  h += buildSchedinaBlockDesk('Esito 1X2', '🎲', todayStr, m => {
    const opts = [
      { k:'1', v:m.value1, o:m.b365h, p:m.prob1i ?? m.prob1, ev:m.ev, lbl:m.home + ' (1)' },
      { k:'X', v:m.valuex, o:m.b365d, p:m.probxi ?? m.probx, ev:m.ev, lbl:'Pareggio (X)' },
      { k:'2', v:m.value2, o:m.b365a, p:m.prob2i ?? m.prob2, ev:m.ev, lbl:m.away + ' (2)' }
    ].filter(o => (o.v||0) > 0 && o.o >= SCH_QUOTA_MIN && o.o <= SCH_QUOTA_MAX && o.p != null && o.p >= SCH_PROB_MIN);
    if (!opts.length) return null;
    opts.sort((a,b) => (b.p||0) - (a.p||0));
    return opts[0];
  });

  h += buildSchedinaBlockDesk('Goal/Goal (GG)', '🥅', todayStr, m => {
    const pgg = m.probGGi ?? m.probGG;
    if (!((m.valueGG||0) > 0 && m.oddGG >= SCH_QUOTA_MIN && m.oddGG <= SCH_QUOTA_MAX && pgg != null && pgg >= SCH_PROB_MIN)) return null;
    return { v:m.valueGG, o:m.oddGG, p:pgg, ev:m.evGg, lbl:'Entrambe segnano (GG)' };
  });

function parseDataItaliana(str) {
  // Converte "SABATO 18 APRILE 2026" → "2026-04-18"
  if (!str) return '';
  // Se già formato ISO
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0,10);
  const mesi = {
    'GENNAIO':'01','FEBBRAIO':'02','MARZO':'03','APRILE':'04',
    'MAGGIO':'05','GIUGNO':'06','LUGLIO':'07','AGOSTO':'08',
    'SETTEMBRE':'09','OTTOBRE':'10','NOVEMBRE':'11','DICEMBRE':'12'
  };
  const parts = str.toUpperCase().trim().split(/\s+/);
  // Formato: "SABATO 18 APRILE 2026" → parts[1]=giorno, parts[2]=mese, parts[3]=anno
  // Oppure: "18 APRILE 2026" → parts[0]=giorno, parts[1]=mese, parts[2]=anno
  let giorno, mese, anno;
  if (parts.length >= 4) {
    giorno = parts[1]; mese = mesi[parts[2]] || '01'; anno = parts[3];
  } else if (parts.length >= 3) {
    giorno = parts[0]; mese = mesi[parts[1]] || '01'; anno = parts[2];
  } else return str;
  return `${anno}-${mese}-${giorno.padStart(2,'0')}`;
}

// FIX 08/10/2026: rimossa una prima definizione duplicata di normalizeCampionato()
// (veniva sovrascritta da quella sotto e non era mai usata).

function parseDataItaliana(str) {
  if (!str) return '';
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return str.slice(0,10);
  const mesi = {
    'GENNAIO':'01','FEBBRAIO':'02','MARZO':'03','APRILE':'04',
    'MAGGIO':'05','GIUGNO':'06','LUGLIO':'07','AGOSTO':'08',
    'SETTEMBRE':'09','OTTOBRE':'10','NOVEMBRE':'11','DICEMBRE':'12'
  };
  // Fix: Excel può troncare la stringa — "202" → "2026" (anno corrente)
  let s = str.toUpperCase().trim();
  s = s.replace(/\b(202)\b(?!\d)/g, '2026'); // "202" → "2026" se non seguito da cifra
  const parts = s.split(/\s+/);
  let giorno, mese, anno;
  if (parts.length >= 4) {
    giorno = parts[1]; mese = mesi[parts[2]]||'01'; anno = parts[3];
  } else if (parts.length >= 3) {
    giorno = parts[0]; mese = mesi[parts[1]]||'01'; anno = parts[2];
  } else return str;
  // Assicura anno 4 cifre
  if (anno && anno.length === 3) anno = anno + '6';
  if (!anno || anno.length < 4) anno = new Date().getFullYear().toString();
  return `${anno}-${mese}-${giorno.padStart(2,'0')}`;
}
