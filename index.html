<head>

<title>ProgettoPro · Match Scanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#080b10;--surf:#0f1420;--card:#141928;--border:#1e2a3d;--accent:#00d4aa;--yellow:#f7b731;--red:#e74c5e;--blue:#4a9eff;--muted:#5a6580;--text:#e8edf5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:52px;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent);}
.logo span{color:var(--text);}
.stats{display:flex;gap:12px;font-size:11px;color:var(--muted);}
.b-bet{color:var(--accent);font-family:'Syne',sans-serif;font-weight:700;}
.b-wtch{color:var(--yellow);font-family:'Syne',sans-serif;font-weight:700;}
.fbar{position:fixed;top:52px;left:0;right:0;z-index:99;background:var(--surf);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 12px;display:flex;gap:8px;align-items:center;}
.fbar::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;font-family:'Syne',sans-serif;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip.active{background:var(--accent);color:#000;border-color:var(--accent);}
.chip.vc.active{background:var(--yellow);color:#000;border-color:var(--yellow);}
.chip.bc.active{background:var(--red);color:#fff;border-color:var(--red);}
.lwrap{position:fixed;top:104px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;transition:transform .35s cubic-bezier(.4,0,.2,1);}
.lwrap.po{transform:translateX(-100%);}
.dgrp{margin-bottom:16px;}
.dlbl{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.mc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;animation:fu .25s ease both;}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
.mc.hv::before{background:var(--yellow);}
.mc.ib{border-color:rgba(0,212,170,.3);}
.mc.ib::before{background:var(--accent);}
@keyframes fu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.bdg{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;}
.bdg.bet{background:rgba(0,212,170,.2);color:var(--accent);}
.bdg.watch{background:rgba(247,183,49,.15);color:var(--yellow);}
.ldot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0;}
.lnm{font-size:10px;font-weight:600;font-family:'Syne',sans-serif;opacity:.7;display:flex;align-items:center;}
.tms{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;line-height:1.3;margin-bottom:10px;}
.tms .vs{color:var(--muted);font-size:10px;font-weight:400;margin:0 5px;}
.or{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.ob{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 6px;text-align:center;transition:border-color .15s;}
.ob.hot{border-color:var(--accent);background:rgba(0,212,170,.08);}
.ol{font-size:9px;color:var(--muted);display:block;margin-bottom:2px;}
.ov{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.ob.hot .ov{color:var(--accent);}
.vb{font-size:9px;display:block;margin-top:2px;font-weight:600;border-radius:2px;padding:1px 3px;}
.vb.pos{color:var(--accent);}
.vb.neg{color:var(--red);opacity:.7;}
/* Pannello */
.panel{position:fixed;top:104px;bottom:0;left:0;right:0;background:var(--surf);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:50;}
.panel.open{transform:translateX(0);}
.pbk{position:sticky;top:0;background:var(--surf);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10;cursor:pointer;}
.ba{font-size:18px;color:var(--accent);}
.pmn{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.pmt{font-size:10px;color:var(--muted);}
.pb{padding:16px;padding-bottom:30px;}
.st{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.st::after{content:'';flex:1;height:1px;background:var(--border);}
.op{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.opb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center;}
.opb.hot{border-color:var(--accent);background:rgba(0,212,170,.08);}
.opl{font-size:9px;color:var(--muted);margin-bottom:4px;}
.opv{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;}
.opb.hot .opv{color:var(--accent);}
.ovbp{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:600;margin-top:3px;display:inline-block;}
.ovbp.pos{background:rgba(0,212,170,.15);color:var(--accent);}
.ovbp.neg{background:rgba(231,76,94,.1);color:var(--red);}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.lt{font-size:10px;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lv{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);}
.ll{font-size:9px;color:var(--muted);margin-top:2px;}
.pr{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.pl{font-size:11px;color:var(--muted);width:70px;flex-shrink:0;}
.pbw{flex:1;background:var(--border);border-radius:3px;height:6px;overflow:hidden;}
.pbar{height:100%;border-radius:3px;background:var(--accent);transition:width .5s ease;}
.pbar.am{background:var(--yellow);}
.pbar.rd{background:var(--red);}
.pp{font-size:11px;font-weight:600;width:36px;text-align:right;}
.fq{font-size:10px;color:var(--muted);width:44px;text-align:right;}
.og{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.oub{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px;text-align:center;}
.oul{font-size:9px;color:var(--muted);}
.oup{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin:2px 0;}
.ouf{font-size:9px;color:var(--muted);}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cl{font-size:11px;color:var(--muted);width:80px;flex-shrink:0;}
.cbw{flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden;}
.cbar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--blue));}
.cv{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.db{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.db.bet{background:rgba(0,212,170,.15);border:1px solid var(--accent);color:var(--accent);}
.db.watch{background:rgba(247,183,49,.12);border:1px solid var(--yellow);color:var(--yellow);}
.db.skip{background:rgba(90,101,128,.12);border:1px solid var(--border);color:var(--muted);}
.ds{font-size:10px;font-weight:400;opacity:.8;}
.nb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:16px;font-size:10px;color:var(--muted);line-height:1.7;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
::-webkit-scrollbar{width:0;height:0;}
</style>
