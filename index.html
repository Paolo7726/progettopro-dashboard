<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#080b10;--surf:#0f1420;--card:#141928;--border:#1e2a3d;--accent:#00d4aa;--yellow:#f7b731;--red:#e74c5e;--blue:#4a9eff;--muted:#5a6580;--text:#e8edf5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:52px;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent);}
.logo span{color:var(--text);}
.stats{display:flex;gap:12px;font-size:11px;color:var(--muted);}
.b-bet{color:var(--accent);font-family:'Syne',sans-serif;font-weight:700;}
.b-wtch{color:var(--yellow);font-family:'Syne',sans-serif;font-weight:700;}
.fbar{position:fixed;top:52px;left:0;right:0;z-index:99;background:var(--surf);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 12px;display:flex;gap:8px;align-items:center;}
.fbar::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;font-family:'Syne',sans-serif;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip.active{background:var(--accent);color:#000;border-color:var(--accent);}
.chip.vc.active{background:var(--yellow);color:#000;border-color:var(--yellow);}
.chip.bc.active{background:var(--red);color:#fff;border-color:var(--red);}
.lwrap{position:fixed;top:104px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;transition:transform .35s cubic-bezier(.4,0,.2,1);}
.lwrap.po{transform:translateX(-100%);}
.dgrp{margin-bottom:16px;}
.dlbl{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.mc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;animation:fu .25s ease both;}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
.mc.hv::before{background:var(--yellow);}
.mc.ib{border-color:rgba(0,212,170,.3);}
.mc.ib::before{background:var(--accent);}
@keyframes fu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.naz-lbl{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;opacity:.45;font-family:'Syne',sans-serif;display:block;margin-bottom:2px;}
.lnm-col{display:flex;flex-direction:column;align-items:flex-start;}
.bdg{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;}
.bdg.bet{background:rgba(0,212,170,.2);color:var(--accent);}
.bdg.watch{background:rgba(247,183,49,.15);color:var(--yellow);}
.ldot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0;}
.lnm{font-size:10px;font-weight:600;font-family:'Syne',sans-serif;opacity:.7;display:flex;align-items:center;}
.tms{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;line-height:1.3;margin-bottom:10px;}

.or{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.ob{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 6px;text-align:center;transition:border-color .15s;}
.ob.hot{border-color:var(--accent);background:rgba(0,212,170,.08);}
.ol{font-size:9px;color:var(--muted);display:block;margin-bottom:2px;}
.ov{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.ob.hot .ov{color:var(--accent);}
.vb{font-size:9px;display:block;margin-top:2px;font-weight:600;border-radius:2px;padding:1px 3px;}
.vb.pos{color:var(--accent);}
.vb.neg{color:var(--red);opacity:.7;}
/* Pannello */
.panel{position:fixed;top:104px;bottom:0;left:0;right:0;background:var(--surf);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:50;}
.panel.open{transform:translateX(0);}
.pbk{position:sticky;top:0;background:var(--surf);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10;cursor:pointer;}
.ba{font-size:18px;color:var(--accent);}
.pmn{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.pmt{font-size:10px;color:var(--muted);}
.pb{padding:16px;padding-bottom:30px;}
.st{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.st::after{content:'';flex:1;height:1px;background:var(--border);}
.op{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.opb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center;}
.opb.hot{border-color:var(--accent);background:rgba(0,212,170,.08);}
.opl{font-size:9px;color:var(--muted);margin-bottom:4px;}
.opv{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;}
.opb.hot .opv{color:var(--accent);}
.ovbp{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:600;margin-top:3px;display:inline-block;}
.ovbp.pos{background:rgba(0,212,170,.15);color:var(--accent);}
.ovbp.neg{background:rgba(231,76,94,.1);color:var(--red);}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.lt{font-size:10px;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lv{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);}

.pbw{flex:1;background:var(--border);border-radius:3px;height:6px;overflow:hidden;}
.pbar{height:100%;border-radius:3px;background:var(--accent);transition:width .5s ease;}
.pbar.am{background:var(--yellow);}
.pbar.rd{background:var(--red);}
.pp{font-size:11px;font-weight:600;width:36px;text-align:right;}
.fq{font-size:10px;color:var(--muted);width:44px;text-align:right;}
.og{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.oub{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px;text-align:center;}
.oul{font-size:9px;color:var(--muted);}
.oup{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin:2px 0;}
.ouf{font-size:9px;color:var(--muted);}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cl{font-size:11px;color:var(--muted);width:80px;flex-shrink:0;}
.cbw{flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden;}
.cbar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--blue));}
.cv{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.db{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.db.bet{background:rgba(0,212,170,.15);border:1px solid var(--accent);color:var(--accent);}
.db.watch{background:rgba(247,183,49,.12);border:1px solid var(--yellow);color:var(--yellow);}
.db.skip{background:rgba(90,101,128,.12);border:1px solid var(--border);color:var(--muted);}
.ds{font-size:10px;font-weight:400;opacity:.8;}
.nb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:16px;font-size:10px;color:var(--muted);line-height:1.7;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
::-webkit-scrollbar{width:0;height:0;}
.ora-tag{background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.25);border-radius:4px;padding:2px 7px;font-size:10px;font-weight:600;color:#4a9eff;margin-right:4px;}
.chip.t5.active{background:linear-gradient(90deg,#f7b731,#e74c5e);color:#000;border-color:#f7b731;}
.top5-wrap{padding:12px 12px 0;}
.top5-hdr{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#f7b731;padding:0 4px 8px;border-bottom:1px solid rgba(247,183,49,.25);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.t5card{background:#1a1f30;border:1px solid rgba(247,183,49,.35);border-radius:12px;padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden;}
.t5card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,#f7b731,#e74c5e);}
.t5rank{position:absolute;top:10px;right:12px;font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:rgba(247,183,49,.2);}
.t5league{font-size:9px;font-weight:700;color:#f7b731;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.t5teams{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;margin-bottom:8px;line-height:1.3;}
.t5teams .vs{color:var(--muted);font-size:10px;font-weight:400;margin:0 4px;}
.t5date{font-size:9px;color:var(--muted);margin-bottom:6px;}
#date-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
.t5pills{display:flex;gap:6px;flex-wrap:wrap;}
.t5pill{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;font-family:'Syne',sans-serif;}
.t5pill.merc{background:rgba(0,212,170,.15);color:var(--accent);}
.t5pill.val{background:rgba(247,183,49,.15);color:#f7b731;}
.t5pill.conf{background:rgba(74,158,255,.15);color:#4a9eff;}
.t5pill.quota{background:rgba(231,76,94,.12);color:#e74c5e;}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px;}
.sc{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center;}
.sc.t1{border-color:var(--accent);background:rgba(0,212,170,.06);}
.sr{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;}
.sp{font-size:10px;color:var(--muted);}
.se{font-size:9px;font-weight:700;margin-top:2px;}
.se.e1{color:var(--accent);}.se.eX{color:var(--yellow);}.se.e2{color:var(--red);}
.cons-box{margin:8px 0;padding:9px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;
  background:linear-gradient(135deg,rgba(0,212,170,.08),rgba(74,158,255,.05));border:1px solid rgba(0,212,170,.3);}
.cons-box.neutro{background:var(--card);border-color:var(--border);}
.cons-icon{font-size:16px;flex-shrink:0;}
.cons-testo{font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--text);line-height:1.3;}
.cons-box.neutro .cons-testo{font-weight:500;color:var(--muted);font-family:'DM Mono',monospace;}
.fw{margin-bottom:10px;}
.fl{font-size:10px;color:var(--muted);margin-bottom:5px;}
.fps{display:flex;gap:5px;flex-wrap:wrap;}
.fp{display:flex;flex-direction:column;align-items:center;gap:2px;}
.fpp{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;}
.fpp.W{background:rgba(0,212,170,.15);color:var(--accent);border:1px solid rgba(0,212,170,.3);}
.fpp.D{background:rgba(247,183,49,.12);color:var(--yellow);border:1px solid rgba(247,183,49,.3);}
.fpp.L{background:rgba(231,76,94,.12);color:var(--red);border:1px solid rgba(231,76,94,.3);}
.fs{font-size:9px;color:var(--muted);}
.fo{font-size:8px;color:var(--muted);max-width:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
/* ── STORICO TAB ─────────────────────────────────── */
.chip.sto.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.sto-wrap{padding:12px 12px 80px;}
.sto-hdr{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--blue);padding:0 4px 8px;
  border-bottom:1px solid rgba(74,158,255,.25);margin-bottom:14px;
  display:flex;align-items:center;gap:6px;}
.kpi4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.kbox{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px;text-align:center;}
.kbox.pos{border-color:rgba(0,212,170,.3);background:rgba(0,212,170,.04);}
.kbox.neg{border-color:rgba(231,76,94,.3);background:rgba(231,76,94,.04);}
.klbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.kval{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:var(--text);}
.kval.g{color:var(--accent);}
.kval.r{color:var(--red);}
.kval.b{color:var(--blue);}
.kval.y{color:var(--yellow);}
.ksub{font-size:9px;color:var(--muted);margin-top:3px;}
.eq-box{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:12px;margin-bottom:14px;}
.eq-ttl{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}

.sto-sec{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.sto-sec::after{content:'';flex:1;height:1px;background:var(--border);}
.res-row{display:flex;align-items:center;gap:6px;padding:8px 0;
  border-bottom:1px solid var(--border);font-size:11px;}
.res-esito{font-family:'Syne',sans-serif;font-weight:800;font-size:10px;
  padding:2px 7px;border-radius:4px;flex-shrink:0;min-width:36px;text-align:center;}
.res-esito.W{background:rgba(0,212,170,.2);color:var(--accent);}
.res-esito.L{background:rgba(231,76,94,.15);color:var(--red);}
.res-match{flex:1;overflow:hidden;}
.res-teams{font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.camp-tbl{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:8px;}

  border-bottom:1px solid var(--border);font-size:9px;}

.yld-neg{color:var(--red);font-weight:700;}
.bar-mini{display:inline-block;height:4px;border-radius:2px;vertical-align:middle;margin-left:4px;}
</style>

<body>
<div class="hdr">
  <div class="logo">Progetto<span>Pro</span></div>
  <div class="stats">Tot:<b id="st" class="b-bet">—</b> BET:<b id="sb" class="b-bet">—</b> WATCH:<b id="sw" class="b-wtch">—</b></div>
</div>
<div class="fbar" id="fb">
  <button class="chip active" id="chip-all-m" onclick="sf('',this)">Tutti</button>
  <!-- chip campionato dinamici — generati da buildChips() -->
  <button class="chip vc" onclick="tv(this)">Solo VALUE+</button>
  <button class="chip bc" onclick="tb(this)">Solo BET</button>
  <button class="chip t5" id="chip-t5" onclick="tt5(this)">★ TOP 5</button>
  <button class="chip sto" id="chip-sto" onclick="tsto(this)">📊 Storico</button>
  <button class="chip sch" id="chip-sch" onclick="tsch(this)">📋 Schedina</button>
  <span style="width:1px;height:18px;background:var(--border);flex-shrink:0;margin:0 2px;"></span>
  <button class="chip active" id="chip-date-all" onclick="clearDateFilter()">Tutte</button>
  <button class="chip" id="chip-date-pick" onclick="openDatePicker()">📅</button>
  <span id="date-lbl" style="font-size:10px;color:var(--muted);flex-shrink:0;"></span>
  <input type="date" id="date-input" onchange="dateChosen(this.value)">
</div>
<div class="lwrap" id="lw"></div>
<div class="panel" id="pn">
  <div class="pbk" onclick="cp()"><span class="ba">←</span>
    <div><div class="pmn" id="ptl">—</div><div class="pmt" id="pmt">—</div></div>
  </div>
  <div class="pb" id="pb"></div>
</div>
<script>
let DATA=[],cf='',vo=false,bo=false,t5o=false,stoo=false,schedinao=false,df='';
// FIX Schedina: stesso range quota di SOGLIA_QUOTA_MIN/MAX in engine.py (1.40-6.00).
// Prima la Schedina sceglieva il mercato con Value% più alto tra 1/X/2 SENZA
// controllare la quota — un Value% enorme su una quota fuori range (es. 9.50,
// tipicamente un solo risultato estremo su un campionato data-sparse) batteva
// un mercato valido, mostrando un "Esito Consigliato" che l'engine Python
// aveva già scartato (Twente-Telstar: Value2=0.82 @ 9.50 vinceva su
// Value_UN25=0.44 @ 3.60, che era invece il pick ufficiale del motore).

function pd(s){if(!s)return'';if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const dm=/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/.exec(s);if(dm)return dm[3]+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0');const M={GENNAIO:'01',FEBBRAIO:'02',MARZO:'03',APRILE:'04',MAGGIO:'05',GIUGNO:'06',LUGLIO:'07',AGOSTO:'08',SETTEMBRE:'09',OTTOBRE:'10',NOVEMBRE:'11',DICEMBRE:'12'};let x=s.toUpperCase().trim().replace(/\b(202)\b(?!\d)/g,'2026');const p=x.split(/\s+/);let g,m,a;if(p.length>=4){g=p[1];m=M[p[2]]||'01';a=p[3];}else if(p.length>=3){g=p[0];m=M[p[1]]||'01';a=p[2];}else return s;if(a&&a.length===3)a+='6';if(!a||a.length<4)a=new Date().getFullYear().toString();return`${a}-${m}-${g.padStart(2,'0')}`;}

return{id:m.Match_ID||(m.Home+'_'+m.Away),home:m.Home||'',away:m.Away||'',league:league,date:pd(m.Date||''),o1:parseFloat(m.Odd1)||0,ox:parseFloat(m.OddX)||0,o2:parseFloat(m.Odd2)||0,p1,px,p2,lh,la,v1,vx,v2,dec,ev:parseFloat(m.EV)||0,evOv25:parseFloat(m.Value_OV25)||0,evGg:parseFloat(m.Value_GG)||0,conf:parseFloat(m.Confidence)||0,kelly:parseFloat(m.Kelly)||0,stake:parseFloat(m.Stake)||0,ov25:parseFloat(m.Prob_OV25)||null,un25:parseFloat(m.Prob_UN25)||null,gg:parseFloat(m.Prob_GG)||null,ng:parseFloat(m.Prob_NG)||null,oOv25:parseFloat(m.Odd_OV25)||0,oGg:parseFloat(m.Odd_GG)||0,vOv25:parseFloat(m.Value_OV25)||0,vGg:parseFloat(m.Value_GG)||0,ora:m.ORA||'',score_probs:m.score_probs||[],forma_home:m.forma_home||[],forma_away:m.forma_away||[],consiglio:m.Consiglio||''};}

function buildChips(){
  const counts={};
  (window.LIVE_DATA||[]).forEach(r=>{
    const c=(IRL_TEAMS.has(r.Home||'')||IRL_TEAMS.has(r.Away||''))?'League of Ireland':nc(r.Campionato||'');
    counts[c]=(counts[c]||0)+1;
  });
  const fb=document.getElementById('fb');
  if(!fb)return;
  // rimuovi chip campionato precedenti — proteggi vc, bc, t5, chip-all-m
  fb.querySelectorAll('.chip:not(.vc):not(.bc):not(.t5):not(.sto):not(.sch):not(#chip-all-m):not(#chip-date-all):not(#chip-date-pick)').forEach(b=>b.remove());
  // inserisci chip campionato prima del primo pulsante fisso (Solo VALUE+)
  const vcBtn=fb.querySelector('.vc');
  const total=(window.LIVE_DATA||[]).length;
  const chipAll=document.getElementById('chip-all-m');
  if(chipAll)chipAll.textContent='Tutti ('+total+')';
  LEAGUE_CFG.forEach(cfg=>{
    const n=counts[cfg.key]||0;
    if(n===0)return;
    const btn=document.createElement('button');
    btn.className='chip';
    btn.textContent=cfg.lbl+' ('+n+')';
    btn.dataset.league=cfg.key;
    btn.onclick=function(){sf(cfg.key,btn);};
    fb.insertBefore(btn,vcBtn);
  });
}

function buildSchedinaBlock(titolo, icona, todayStr, pickFn){
  // FIX 21/09/2026: prima il punteggio era 75% Value%/EV + 25% Confidence.
  // Value% (=p_modello*quota-1) cresce meccanicamente con la quota anche a
  // parità di errore assoluto di stima — quindi il ranking finiva per
  // premiare sempre le quote più lunghe, non l'affidabilità del segnale.
  // Ora: soglia minima di Confidence (stessa usata per i BET veri,
  // SOGLIA_CONFIDENCE=0.55 in engine.py) per entrare in schedina, e score
  // ribilanciato a favore della Confidence.
  const SOGLIA_CONFIDENCE_SCHEDINA = 0.55;
  const cand=DATA.filter(m=>m.date===todayStr&&m.home&&m.away&&(m.conf||0)>=SOGLIA_CONFIDENCE_SCHEDINA).map(m=>{
    const opt=pickFn(m);
    if(!opt)return null;
    const score=(m.conf||0)*0.50+(opt.ev||0)*0.30+(opt.v||0)*0.20;
    return {m,best:opt,score};
  }).filter(Boolean);
  const betOnly=cand.filter(c=>c.m.dec==='BET').sort((a,b)=>b.score-a.score);
  const watchOnly=cand.filter(c=>c.m.dec!=='BET').sort((a,b)=>b.score-a.score);
  const scelte=[...betOnly,...watchOnly].slice(0,3);
  let h=`<div class="sto-hdr" style="margin-top:22px;">${icona} ${titolo}</div>`;
  if(!scelte.length){
    h+='<div class="empty"><div style="font-size:32px;opacity:.3;margin-bottom:8px">🔍</div><p>Nessun segnale sufficiente oggi per questo mercato</p></div>';
    return h;
  }
  if(scelte.length<3){
    h+=`<div style="font-size:11px;color:var(--yellow);background:rgba(247,183,49,.08);border:1px solid rgba(247,183,49,.25);border-radius:8px;padding:8px 12px;margin-bottom:12px;">⚠️ Solo ${scelte.length} partit${scelte.length===1?'a':'e'} disponibil${scelte.length===1?'e':'i'} oggi con segnale sufficiente — proposta ridotta, non a 3 selezioni.</div>`;
  }
  let comboOdd=1,comboProb=1;
  scelte.forEach((c,i)=>{
    comboOdd*=c.best.o;comboProb*=(c.best.p||0);
    const naz=nazOf(c.m.league);
    h+=`<div class="mc" style="animation-delay:${i*.05}s"><div class="ctop"><span class="lnm-col">${naz?`<span class="naz-lbl">${naz}</span>`:''}<span class="lnm"><span class="ldot" style="background:${LC[c.m.league]||'#5a6580'}"></span>${lnmOf(c.m.league)}${c.m.ora?' <span style="opacity:.5;font-weight:400">- '+c.m.ora+'</span>':''}</span></span><span class="bdg ${c.m.dec==='BET'?'bet':'watch'}">${c.m.dec==='BET'?'⚡ BET':'👁 WATCH'}</span></div>`;
    h+=`<div class="tms">${c.m.home} <span class="vs">vs</span> ${c.m.away}</div>`;
    h+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">`;
    h+=`<div><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Esito consigliato</div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px;color:var(--accent);">${c.best.lbl}</div></div>`;
    h+=`<div style="text-align:right;"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;">Quota</div><div style="font-family:'Syne',sans-serif;font-weight:800;font-size:16px;">${odd(c.best.o)}</div></div>`;
    h+=`</div></div>`;
  });
  const stakeTot=5;
  const vincita=(stakeTot*comboOdd).toFixed(2);
  h+=`<div style="background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-top:4px;">`;
  h+=`<div style="font-family:'Syne',sans-serif;font-weight:800;font-size:13px;color:var(--accent);margin-bottom:12px;">🎟️ Riepilogo Multipla (${scelte.length} eventi)</div>`;
  h+=`<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:11px;color:var(--muted);">Quota combinata</span><span style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;">${comboOdd.toFixed(2)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:11px;color:var(--muted);">Probabilità reale stimata</span><span style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;">${(comboProb*100).toFixed(1)}%</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="font-size:11px;color:var(--muted);">Puntata suggerita</span><span style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;">€${stakeTot.toFixed(2)}</span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;"><span style="font-size:11px;color:var(--muted);">Vincita potenziale</span><span style="font-family:'Syne',sans-serif;font-weight:800;font-size:15px;color:var(--accent);">€${vincita}</span></div>`;
  h+=`</div>`;
  h+=`<div style="font-size:10px;color:var(--muted);line-height:1.5;margin-top:10px;padding:0 4px;">⚠️ ${scelte.length} eventi combinati in un'unica giocata: il rischio è più alto della somma dei singoli — basta un esito sbagliato per perdere l'intera schedina. La probabilità reale stimata sopra riflette questo, non farti guidare solo dalla quota.</div>`;
  return h;
}
function renderSchedina(lw){
  const now=new Date();
  const todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  const oggiLbl=now.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
  let h=`<div class="sto-hdr">📋 Schedina del giorno — ${oggiLbl.charAt(0).toUpperCase()+oggiLbl.slice(1)}</div>`;
  // Blocco 1X2 — sceglie il mercato 1/X/2 con value% più alto
  h+=buildSchedinaBlock('Esito 1X2','🎲',todayStr,m=>{
    const opts=[
      {k:'1',v:m.v1,o:m.o1,p:m.p1,ev:m.ev,lbl:m.home+' (1)'},
      {k:'X',v:m.vx,o:m.ox,p:m.px,ev:m.ev,lbl:'Pareggio (X)'},
      {k:'2',v:m.v2,o:m.o2,p:m.p2,ev:m.ev,lbl:m.away+' (2)'}
    ].filter(o=>(o.v||0)>0&&o.o>=SCH_QUOTA_MIN&&o.o<=SCH_QUOTA_MAX&&o.p!=null);
    if(!opts.length)return null;
    opts.sort((a,b)=>(b.v||0)-(a.v||0));
    return opts[0];
  });
  // Blocco Goal/Goal
  h+=buildSchedinaBlock('Goal/Goal (GG)','🥅',todayStr,m=>{
    if(!((m.vGg||0)>0&&m.oGg>=SCH_QUOTA_MIN&&m.oGg<=SCH_QUOTA_MAX&&m.gg!=null))return null;
    return {v:m.vGg,o:m.oGg,p:m.gg,ev:m.evGg,lbl:'Entrambe segnano (GG)'};
  });
  // Blocco Over 2.5
  h+=buildSchedinaBlock('Over 2.5 Gol','⚽',todayStr,m=>{
    if(!((m.vOv25||0)>0&&m.oOv25>=SCH_QUOTA_MIN&&m.oOv25<=SCH_QUOTA_MAX&&m.ov25!=null))return null;
    return {v:m.vOv25,o:m.oOv25,p:m.ov25,ev:m.evOv25,lbl:'Over 2.5'};
  });
  lw.innerHTML=h;
}
function renderStorico(lw){
  const sd=window.LIVE_STORICO;
  if(!sd||!sd.n){lw.innerHTML='<div class="empty"><p style="font-size:30px;margin-bottom:12px">📊</p><p>Nessun dato storico disponibile</p><p style="font-size:11px;margin-top:8px;color:var(--muted)">Lancia engine.py per aggiornare</p></div>';return;}
  const plPos=sd.pl>=0;
  let h='<div class="sto-wrap">';
  h+='<div class="sto-hdr">📊 Storico Scommesse — '+sd.n+' bet analizzati</div>';
  // KPI 4 card
  h+='<div class="kpi4">';
  h+=`<div class="kbox ${plPos?'pos':'neg'}"><div class="klbl">Bankroll</div><div class="kval ${plPos?'g':'r'}">€${sd.bankroll.toFixed(0)}</div><div class="ksub">${plPos?'+':''}€${sd.pl.toFixed(2)} da €1000</div></div>`;
  h+=`<div class="kbox"><div class="klbl">Win Rate</div><div class="kval b">${sd.win_rate}%</div><div class="ksub">${sd.wins}W / ${sd.losses}L</div></div>`;
  h+=`<div class="kbox ${sd.yld>=0?'pos':'neg'}"><div class="klbl">Yield</div><div class="kval ${sd.yld>=0?'g':'r'}">${sd.yld>=0?'+':''}${sd.yld}%</div><div class="ksub">ROI ${sd.roi>=0?'+':''}${sd.roi}%</div></div>`;
  h+=`<div class="kbox"><div class="klbl">Streak</div><div class="kval y" style="font-size:18px">${sd.streak}</div><div class="ksub">Quota media ${sd.avg_quota}</div></div>`;
  h+='</div>';
  // Equity curve (canvas SVG inline)
  const eq=sd.equity||[];
  if(eq.length>1){
    const mn=Math.min(...eq),mx=Math.max(...eq),rng=mx-mn||1;
    const W=320,H=80,pad=4;
    const pts=eq.map((v,i)=>{
      const x=pad+(i/(eq.length-1))*(W-pad*2);
      const y=H-pad-(v-mn)/rng*(H-pad*2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const lastY=H-pad-(eq[eq.length-1]-mn)/rng*(H-pad*2);
    const baseY=H-pad-(1000-mn)/rng*(H-pad*2);
    const color=eq[eq.length-1]>=1000?'#00d4aa':'#e74c5e';
    const fillColor=eq[eq.length-1]>=1000?'rgba(0,212,170,.1)':'rgba(231,76,94,.08)';
    const firstPt=eq.map((v,i)=>{const x=pad+(i/(eq.length-1))*(W-pad*2);return x.toFixed(1);});
    const areaPath=`M${pad},${baseY.toFixed(1)} ` + eq.map((v,i)=>{
      const x=pad+(i/(eq.length-1))*(W-pad*2);
      const y=H-pad-(v-mn)/rng*(H-pad*2);
      return `L${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ') + ` L${(W-pad).toFixed(1)},${baseY.toFixed(1)} Z`;
    h+=`<div class="eq-box">
