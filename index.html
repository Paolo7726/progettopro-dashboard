<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#080b10;--surf:#0f1420;--card:#141928;--border:#1e2a3d;--accent:#00d4aa;--yellow:#f7b731;--red:#e74c5e;--blue:#4a9eff;--muted:#5a6580;--text:#e8edf5;}

.fbar{position:fixed;top:52px;left:0;right:0;z-index:99;background:var(--surf);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 12px;display:flex;gap:8px;align-items:center;}

.chip.vc.active{background:var(--yellow);color:#000;border-color:var(--yellow);}
.chip.bc.active{background:var(--red);color:#fff;border-color:var(--red);}
.lwrap{position:fixed;top:104px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;transition:transform .35s cubic-bezier(.4,0,.2,1);}

.cons-icon{font-size:16px;flex-shrink:0;}

.fl{font-size:10px;color:var(--muted);margin-bottom:5px;}

</style>

<script>
let DATA=[],cf='',vo=false,bo=false,t5o=false,stoo=false;
const LC={'Serie A':'#4a9eff','Serie B':'#00d4aa','Serie C':'#f7b731','Premier League':'#a855f7','La Liga':'#e74c5e','La Liga 2':'#f97316','Bundesliga':'#f97316','Bundesliga 2':'#f59e0b','Ligue 1':'#06b6d4','Eredivisie':'#10b981','Jupiler Pro':'#4a9eff','Super Lig':'#e74c5e','Primeira Liga':'#22c55e','Allsvenskan':'#0ea5e9','SVEZIA':'#0ea5e9','Veikkausliiga':'#38bdf8','FINLANDIA':'#38bdf8','J1 League':'#f43f5e','GIAPPONE':'#f43f5e','Chinese Super League':'#fb923c','CINA':'#fb923c','League of Ireland':'#16a34a','IRLANDA':'#16a34a','Eliteserien':'#c026d3','NORVEGIA':'#c026d3','A-League':'#eab308','AUSTRIA':'#eab308','Primera Division':'#ec4899','ARGENTINA':'#ec4899'};
function pd(s){if(!s)return'';if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const dm=/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})$/.exec(s);if(dm)return dm[3]+'-'+dm[2].padStart(2,'0')+'-'+dm[1].padStart(2,'0');const M={GENNAIO:'01',FEBBRAIO:'02',MARZO:'03',APRILE:'04',MAGGIO:'05',GIUGNO:'06',LUGLIO:'07',AGOSTO:'08',SETTEMBRE:'09',OTTOBRE:'10',NOVEMBRE:'11',DICEMBRE:'12'};let x=s.toUpperCase().trim().replace(/\b(202)\b(?!\d)/g,'2026');const p=x.split(/\s+/);let g,m,a;if(p.length>=4){g=p[1];m=M[p[2]]||'01';a=p[3];}else if(p.length>=3){g=p[0];m=M[p[1]]||'01';a=p[2];}else return s;if(a&&a.length===3)a+='6';if(!a||a.length<4)a=new Date().getFullYear().toString();return`${a}-${m}-${g.padStart(2,'0')}`;}
function nc(c){const MP={BELGIO:'Jupiler Pro',TURCHIA:'Super Lig',PORTOGALLO:'Primeira Liga',ITALIA:'Serie A',INGHILTERRA:'Premier League',SPAGNA:'La Liga',GERMANIA:'Bundesliga',FRANCIA:'Ligue 1',OLANDA:'Eredivisie','PAESI BASSI':'Eredivisie',SVEZIA:'Allsvenskan',FINLANDIA:'Veikkausliiga',GIAPPONE:'J1 League',CINA:'Chinese Super League',IRLANDA:'League of Ireland',IRL:'League of Ireland','LEAGUE OF IRELAND':'League of Ireland','PREMIER DIVISION':'League of Ireland',NORVEGIA:'Eliteserien',NORWAY:'Eliteserien',AUSTRIA:'A-League','AUSTRIA BUNDESLIGA':'A-League',ARGENTINA:'Primera Division'};return MP[(c||'').toUpperCase()]||c;}
const IRL_TEAMS=new Set(['Bohemians','Bohemian','Bohemian Dublino','Shamrock Rovers','Shamrock','Shelbourne','Shelbourne FC','Derry City','Dundalk','Dundalk FC','St Patricks','St. Patricks','St Patricks Athletic','St. Patricks Athletic','Drogheda','Drogheda United','Waterford','Waterford FC','Sligo Rovers','Sligo','Galway','Galway United','Cork City','Finn Harps','Longford Town','Athlone','Treaty United','Wexford FC']);
function ar(m){const v1=m.Value1!=null?parseFloat(m.Value1):null,vx=m.ValueX!=null?parseFloat(m.ValueX):null,v2=m.Value2!=null?parseFloat(m.Value2):null;const p1=m.Prob1!=null?parseFloat(m.Prob1):null,px=m.ProbX!=null?parseFloat(m.ProbX):null,p2=m.Prob2!=null?parseFloat(m.Prob2):null;const lh=m.lam_h!=null?parseFloat(m.lam_h):null,la=m.lam_a!=null?parseFloat(m.lam_a):null;let dec=(m.Decision||'').replace('—','').trim();if(!dec){const vm=Math.max(v1||0,vx||0,v2||0);dec=vm>0.05?'BET':vm>0?'WATCH':'SKIP';}

function buildChips(){
  const counts={};
  (window.LIVE_DATA||[]).forEach(r=>{
    const c=(IRL_TEAMS.has(r.Home||'')||IRL_TEAMS.has(r.Away||''))?'League of Ireland':nc(r.Campionato||'');
    counts[c]=(counts[c]||0)+1;
  });
  const fb=document.getElementById('fb');
  if(!fb)return;
  // rimuovi chip campionato precedenti — proteggi vc, bc, t5, chip-all-m
  fb.querySelectorAll('.chip:not(.vc):not(.bc):not(.t5):not(.sto):not(#chip-all-m)').forEach(b=>b.remove());
  // inserisci chip campionato prima del primo pulsante fisso (Solo VALUE+)
  const vcBtn=fb.querySelector('.vc');
  const total=(window.LIVE_DATA||[]).length;
  const chipAll=document.getElementById('chip-all-m');
  if(chipAll)chipAll.textContent='Tutti ('+total+')';
  LEAGUE_CFG.forEach(cfg=>{
    const n=counts[cfg.key]||0;
    if(n===0)return;
    const btn=document.createElement('button');
    btn.className='chip';
    btn.textContent=cfg.lbl+' ('+n+')';
    btn.dataset.league=cfg.key;
    btn.onclick=function(){sf(cfg.key,btn);};
    fb.insertBefore(btn,vcBtn);
  });
}

function renderStorico(lw){

    const lastY=H-pad-(eq[eq.length-1]-mn)/rng*(H-pad*2);

      <svg viewBox="0 0 ${W} ${H}" class="eq-canvas" xmlns="http://www.w3.org/2000/svg">

        <path d="${areaPath}" fill="${fillColor}"/>
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="${(W-pad).toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="${color}"/>
        <text x="${pad+2}" y="${H-1}" fill="#5a6580" font-size="8">€${mn.toFixed(0)}</text>
        <text x="${pad+2}" y="10" fill="#5a6580" font-size="8">€${mx.toFixed(0)}</text>
        <text x="${(W-pad-2).toFixed(1)}" y="${lastY-5}" fill="${color}" font-size="9" text-anchor="end" font-weight="bold">€${eq[eq.length-1].toFixed(0)}</text>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:2px;">

        <span>${sd.n} scommesse</span>
      </div>
    </div>`;
  }
  // Recent results
  h+='<div class="sto-sec">Ultimi risultati</div>';
  (sd.recenti||[]).forEach(r=>{
    const pl=r.pl||0;
    h+=`<div class="res-row">
      <span class="res-esito ${r.esito==='WIN'?'W':'L'}">${r.esito}</span>
      <div class="res-match">
        <div class="res-teams">${r.home} vs ${r.away}</div>

      <span class="res-pl ${pl>=0?'g':'r'}">${pl>=0?'+':''}€${Math.abs(pl).toFixed(2)}</span>
    </div>`;
  });
  // Campionati
  h+='<div class="sto-sec" style="margin-top:18px">Per campionato</div>';
  h+='<table class="camp-tbl"><tr><th>Lega</th><th>N</th><th>Win%</th><th>Yield</th><th>P&L</th></tr>';

      <td style="font-weight:600">${c.c}</td>
      <td style="color:var(--muted)">${c.n}</td>
      <td>${c.wr}%</td>
      <td><span class="${yc>=0?'yld-pos':'yld-neg'}">${yc>=0?'+':''}${yc}%</span><span class="bar-mini" style="width:${barW}px;background:${barCol};opacity:.5"></span></td>
      <td style="font-size:9px;color:${c.pl>=0?'var(--accent)':'var(--red)'}">${c.pl>=0?'+':''}${c.pl.toFixed(0)}€</td>
    </tr>`;
  });
  h+='</table>';
  h+='<div style="text-align:center;font-size:9px;color:var(--muted);margin-top:8px;padding-bottom:20px">Dati onesti — win e lose inclusi</div>';
  h+='</div>';
