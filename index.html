<head>

<title>ProgettoPro · Match Scanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#080b10;--surf:#0f1420;--card:#141928;--border:#1e2a3d;--accent:#00d4aa;--yellow:#f7b731;--red:#e74c5e;--blue:#4a9eff;--muted:#5a6580;--text:#e8edf5;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:'DM Mono',monospace;background:var(--bg);color:var(--text);}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surf);border-bottom:1px solid var(--border);position:fixed;top:0;left:0;right:0;z-index:100;height:52px;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:var(--accent);}
.logo span{color:var(--text);}
.stats{display:flex;gap:12px;font-size:11px;color:var(--muted);}
.b-bet{color:var(--accent);font-family:'Syne',sans-serif;font-weight:700;}
.b-wtch{color:var(--yellow);font-family:'Syne',sans-serif;font-weight:700;}
.fbar{position:fixed;top:52px;left:0;right:0;z-index:99;background:var(--surf);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;white-space:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 12px;display:flex;gap:8px;align-items:center;}
.fbar::-webkit-scrollbar{display:none;}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700;font-family:'Syne',sans-serif;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap;}
.chip.active{background:var(--accent);color:#000;border-color:var(--accent);}
.chip.vc.active{background:var(--yellow);color:#000;border-color:var(--yellow);}
.chip.bc.active{background:var(--red);color:#fff;border-color:var(--red);}
.lwrap{position:fixed;top:104px;bottom:0;left:0;right:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 20px;transition:transform .35s cubic-bezier(.4,0,.2,1);}
.lwrap.po{transform:translateX(-100%);}
.dgrp{margin-bottom:16px;}
.dlbl{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:10px;}
.mc{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;animation:fu .25s ease both;}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
.mc.hv::before{background:var(--yellow);}
.mc.ib{border-color:rgba(0,212,170,.3);}
.mc.ib::before{background:var(--accent);}
@keyframes fu{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
.ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.ctop-left{display:flex;align-items:center;gap:8px;}
.bdg{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;}
.bdg.bet{background:rgba(0,212,170,.2);color:var(--accent);}
.bdg.watch{background:rgba(247,183,49,.15);color:var(--yellow);}
.ora-tag{font-size:10px;font-weight:600;color:var(--blue);background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.25);border-radius:4px;padding:2px 7px;font-family:'Syne',sans-serif;}
.ldot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:5px;flex-shrink:0;}
.lnm{font-size:10px;font-weight:600;font-family:'Syne',sans-serif;opacity:.7;display:flex;align-items:center;}
.tms{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;line-height:1.3;margin-bottom:10px;}
.tms .vs{color:var(--muted);font-size:10px;font-weight:400;margin:0 5px;}
.or{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.ob{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:7px 6px;text-align:center;transition:border-color .15s;}
.ob.hot{border-color:var(--accent);background:rgba(0,212,170,.08);}
.ol{font-size:9px;color:var(--muted);display:block;margin-bottom:2px;}
.ov{font-family:'Syne',sans-serif;font-weight:700;font-size:15px;}
.ob.hot .ov{color:var(--accent);}
.vb{font-size:9px;display:block;margin-top:2px;font-weight:600;border-radius:2px;padding:1px 3px;}
.vb.pos{color:var(--accent);}
.vb.neg{color:var(--red);opacity:.7;}
/* Pannello */
.panel{position:fixed;top:104px;bottom:0;left:0;right:0;background:var(--surf);overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);z-index:50;}
.panel.open{transform:translateX(0);}
.pbk{position:sticky;top:0;background:var(--surf);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:10;cursor:pointer;}
.ba{font-size:18px;color:var(--accent);}
.pmn{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.pmt{font-size:10px;color:var(--muted);}
.pb{padding:16px;padding-bottom:30px;}
.st{font-family:'Syne',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:16px 0 8px;display:flex;align-items:center;gap:6px;}
.st::after{content:'';flex:1;height:1px;background:var(--border);}
.op{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.opb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 8px;text-align:center;}
.opb.hot{border-color:var(--accent);background:rgba(0,212,170,.08);}
.opl{font-size:9px;color:var(--muted);margin-bottom:4px;}
.opv{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;}
.opb.hot .opv{color:var(--accent);}
.ovbp{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:600;margin-top:3px;display:inline-block;}
.ovbp.pos{background:rgba(0,212,170,.15);color:var(--accent);}
.ovbp.neg{background:rgba(231,76,94,.1);color:var(--red);}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.lt{font-size:10px;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lv{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;color:var(--accent);}
.ll{font-size:9px;color:var(--muted);margin-top:2px;}
.pr{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.pl{font-size:11px;color:var(--muted);width:70px;flex-shrink:0;}
.pbw{flex:1;background:var(--border);border-radius:3px;height:6px;overflow:hidden;}
.pbar{height:100%;border-radius:3px;background:var(--accent);transition:width .5s ease;}
.pbar.am{background:var(--yellow);}
.pbar.rd{background:var(--red);}
.pp{font-size:11px;font-weight:600;width:36px;text-align:right;}
.fq{font-size:11px;color:var(--muted);width:44px;text-align:right;}
.og{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.oub{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px;text-align:center;}
.oul{font-size:9px;color:var(--muted);}
.oup{font-family:'Syne',sans-serif;font-weight:700;font-size:13px;margin:2px 0;}
.ouf{font-size:9px;color:var(--muted);}
.cr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.cl{font-size:11px;color:var(--muted);width:80px;flex-shrink:0;}
.cbw{flex:1;background:var(--border);border-radius:4px;height:8px;overflow:hidden;}
.cbar{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--blue));}
.cv{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.db{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;}
.db.bet{background:rgba(0,212,170,.15);border:1px solid var(--accent);color:var(--accent);}
.db.watch{background:rgba(247,183,49,.12);border:1px solid var(--yellow);color:var(--yellow);}
.db.skip{background:rgba(90,101,128,.12);border:1px solid var(--border);color:var(--muted);}
.ds{font-size:10px;font-weight:400;opacity:.8;}
.nb{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:16px;font-size:10px;color:var(--muted);line-height:1.7;}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
/* ── RISULTATI ESATTI ── */
.scores-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.sc{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 4px;text-align:center;}
.sc.top1{border-color:var(--accent);background:rgba(0,212,170,.06);}
.sc-res{font-family:'Syne',sans-serif;font-weight:800;font-size:16px;}
.sc-pct{font-size:10px;color:var(--muted);margin-top:1px;}
.sc-esito{font-size:9px;font-weight:700;margin-top:2px;}
.sc-esito.e1{color:var(--accent);}
.sc-esito.eX{color:var(--yellow);}
.sc-esito.e2{color:var(--red);}
/* ── FORMA ── */
.forma-wrap{margin-bottom:10px;}
.forma-lbl{font-size:10px;color:var(--muted);margin-bottom:6px;}
.forma-pills{display:flex;gap:6px;flex-wrap:wrap;}
.fp{display:flex;flex-direction:column;align-items:center;gap:2px;}
.fp-pill{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:12px;}
.fp-pill.W{background:rgba(0,212,170,.15);color:var(--accent);border:1px solid rgba(0,212,170,.3);}
.fp-pill.D{background:rgba(247,183,49,.12);color:var(--yellow);border:1px solid rgba(247,183,49,.3);}
.fp-pill.L{background:rgba(231,76,94,.12);color:var(--red);border:1px solid rgba(231,76,94,.3);}
.fp-score{font-size:9px;color:var(--muted);}
.fp-opp{font-size:8px;color:var(--muted);max-width:36px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>

function pd(s){if(!s)return'';if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);const M={GENNAIO:'01',FEBBRAIO:'02',MARZO:'03',APRILE:'04',MAGGIO:'05',GIUGNO:'06',LUGLIO:'07',AGOSTO:'08',SETTEMBRE:'09',OTTOBRE:'10',NOVEMBRE:'11',DICEMBRE:'12'};let x=s.toUpperCase().trim();const p=x.split(/\s+/);let g,m,a;if(p.length>=4){g=p[1];m=M[p[2]]||'01';a=p[3];}else if(p.length>=3){g=p[0];m=M[p[1]]||'01';a=p[2];}else return s;if(a&&a.length===3)a+='6';if(!a||a.length<4)a=new Date().getFullYear().toString();return`${a}-${m}-${g.padStart(2,'0')}`;}

function nc(c){const MP={BELGIO:'Jupiler Pro',TURCHIA:'Super Lig',PORTOGALLO:'Primeira Liga',ITALIA:'Serie A',INGHILTERRA:'Premier League',SPAGNA:'La Liga',GERMANIA:'Bundesliga',FRANCIA:'Ligue 1',OLANDA:'Eredivisie','PAESI BASSI':'Eredivisie'};return MP[(c||'').toUpperCase()]||c;}

function ar(m){const v1=m.Value1!=null?parseFloat(m.Value1):null,vx=m.ValueX!=null?parseFloat(m.ValueX):null,v2=m.Value2!=null?parseFloat(m.Value2):null;const p1=m.Prob1!=null?parseFloat(m.Prob1):null,px=m.ProbX!=null?parseFloat(m.ProbX):null,p2=m.Prob2!=null?parseFloat(m.Prob2):null;const lh=m.lam_h!=null?parseFloat(m.lam_h):null,la=m.lam_a!=null?parseFloat(m.lam_a):null;let dec=(m.Decision||'').replace('—','').trim();if(!dec){const vm=Math.max(v1||0,vx||0,v2||0);dec=vm>0.05?'BET':vm>0?'WATCH':'SKIP';}
const camp=m.Campionato_AS||m.Campionato||'';const league=camp&&camp!==''?camp:nc(m.Campionato||'');
return{id:m.Match_ID||(m.Home+'_'+m.Away),home:m.Home||'',away:m.Away||'',league,date:pd(m.Date||''),ora:m.ORA||'',o1:parseFloat(m.Odd1)||0,ox:parseFloat(m.OddX)||0,o2:parseFloat(m.Odd2)||0,p1,px,p2,lh,la,v1,vx,v2,dec,conf:parseFloat(m.Confidence)||0,kelly:parseFloat(m.Kelly)||0,stake:parseFloat(m.Stake)||0,tipo:m.TipoScommessa||'',odds_bet:parseFloat(m.Odds_Bet)||0,score_probs:m.score_probs||[],forma_home:m.forma_home||[],forma_away:m.forma_away||};}

function ou(lh,la){if(!lh||!la)return null;const t=lh+la;return{ov05:1-Math.exp(-t),ov15:1-Math.exp(-t)*(1+t),ov25:1-Math.exp(-t)*(1+t+t*t/2),ov35:1-Math.exp(-t)*(1+t+t*t/2+Math.pow(t,3)/6),gg:(1-Math.exp(-lh))*(1-Math.exp(-la))};}

const pct=v=>(v!=null&&!isNaN(v))?(v*100).toFixed(1)+'%':'—';
const fair=p=>(p!=null&&!isNaN(p)&&p>0.01)?(1/p).toFixed(2):'—';
const odd=v=>(v&&v>1)?v.toFixed(2):'—';
const vbadge=(v,c=false)=>{if(v==null)return'';const cls=v>0?'pos':'neg',sg=v>0?'+':'';const lb=`${sg}${(v*100).toFixed(1)}%`;return c?`<span class="vb ${cls}">${lb}</span>`:`<span class="ovbp ${cls}">${lb}</span>`;};

const LEAGUE_CFG=[
  {key:'Serie A',lbl:'Serie A'},{key:'Serie B',lbl:'Serie B'},
  {key:'Premier League',lbl:'Premier'},{key:'Championship',lbl:'Championship'},
  {key:'La Liga',lbl:'La Liga'},{key:'La Liga 2',lbl:'Liga 2'},
  {key:'Bundesliga',lbl:'Bundesliga'},{key:'Bundesliga 2',lbl:'BL2'},
  {key:'Ligue 1',lbl:'Ligue 1'},{key:'Eredivisie',lbl:'Olanda'},
  {key:'Jupiler Pro',lbl:'Belgio'},{key:'Super Lig',lbl:'Turchia'},
  {key:'Primeira Liga',lbl:'Portogallo'},
];

function buildChips(){
  const counts={};
  (window.LIVE_DATA||[]).forEach(r=>{const c=r.Campionato||'';counts[c]=(counts[c]||0)+1;});
  const fb=document.getElementById('fb');if(!fb)return;
  fb.querySelectorAll('.chip:not(.vc):not(.bc):not(#chip-all-m)').forEach(b=>b.remove());
  const vcBtn=fb.querySelector('.vc');
  const total=(window.LIVE_DATA||[]).length;
  const chipAll=document.getElementById('chip-all-m');
  if(chipAll)chipAll.textContent='Tutti ('+total+')';
  LEAGUE_CFG.forEach(cfg=>{
    const n=counts[cfg.key]||0;if(n===0)return;
    const btn=document.createElement('button');
    btn.className='chip';btn.textContent=cfg.lbl+' ('+n+')';
    btn.dataset.league=cfg.key;
    btn.onclick=function(){sf(cfg.key,btn);};
    fb.insertBefore(btn,vcBtn);
  });
}

function sf(l,el){cf=l;vo=false;bo=false;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));if(el)el.classList.add('active');render();}
function tv(el){vo=!vo;bo=false;document.querySelectorAll('.vc,.bc').forEach(c=>c.classList.remove('active'));if(vo)el.classList.add('active');render();}
function tb(el){bo=!bo;vo=false;document.querySelectorAll('.vc,.bc').forEach(c=>c.classList.remove('active'));if(bo)el.classList.add('active');render();}

function render(){
  const ti=new Date().toISOString().slice(0,10);
  let fil=DATA.filter(m=>{
    if(!m.home)return false;
    if(m.date&&m.date<ti)return false;
    if(cf&&m.league!==cf)return false;
    if(vo&&(m.v1||0)<=0&&(m.vx||0)<=0&&(m.v2||0)<=0)return false;
    if(bo&&m.dec!=='BET')return false;
    return true;
  });
  document.getElementById('st').textContent=fil.length;
  document.getElementById('sb').textContent=fil.filter(m=>m.dec==='BET').length;
  document.getElementById('sw').textContent=fil.filter(m=>m.dec==='WATCH').length;
  const bd={};fil.forEach(m=>{(bd[m.date]=bd[m.date]||[]).push(m);});
  const lw=document.getElementById('lw');
  if(!fil.length){lw.innerHTML='<div class="empty"><div style="font-size:40px;opacity:.3;margin-bottom:12px">🔍</div><p>Nessuna partita</p></div>';return;}
  let h='';
  for(const dt of Object.keys(bd).sort()){
    let lb=dt;try{const d=new Date(dt+'T12:00:00');lb=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});lb=lb.charAt(0).toUpperCase()+lb.slice(1);}catch(e){}
    h+=`<div class="dgrp"><div class="dlbl">${lb} — ${bd[dt].length} partite</div>`;
    bd[dt].forEach((m,i)=>{
      const hv=(m.v1||0)>0||(m.vx||0)>0||(m.v2||0)>0,cls=m.dec==='BET'?'ib':hv?'hv':'';
      const dot=LC[m.league]||'#5a6580';
      const bdg=m.dec==='BET'?'<span class="bdg bet">⚡ BET</span>':m.dec==='WATCH'?'<span class="bdg watch">👁 WATCH</span>':'';
      const oraHtml=m.ora?`<span class="ora-tag">⏰ ${m.ora}</span>`:'';
      h+=`<div class="mc ${cls}" data-id="${m.id}" onclick="om('${m.id}')" style="animation-delay:${i*.03}s">
<div class="ctop"><span class="lnm"><span class="ldot" style="background:${dot}"></span>${m.league}</span><div class="ctop-left">${oraHtml}${bdg}</div></div>
<div class="tms">${m.home} <span class="vs">vs</span> ${m.away}</div>
<div class="or">
<div class="ob ${(m.v1||0)>0?'hot':''}"><span class="ol">1 Casa</span><span class="ov">${odd(m.o1)}</span>${vbadge(m.v1,true)}</div>
<div class="ob ${(m.vx||0)>0?'hot':''}"><span class="ol">X Pareggio</span><span class="ov">${odd(m.ox)}</span>${vbadge(m.vx,true)}</div>
<div class="ob ${(m.v2||0)>0?'hot':''}"><span class="ol">2 Ospite</span><span class="ov">${odd(m.o2)}</span>${vbadge(m.v2,true)}</div>
</div></div>`;
    });
    h+='</div>';
  }
  lw.innerHTML=h;
}

function buildForma(forma,label){
  if(!forma||forma.length===0)return'';
  const pills=forma.slice(0,5).map(f=>`<div class="fp"><div class="fp-pill ${f.ris}">${f.ris}</div><div class="fp-score">${f.gf}-${f.gs}</div><div class="fp-opp">${f.opp||''}</div></div>`).join('');
  return`<div class="forma-wrap"><div class="forma-lbl">${label}</div><div class="forma-pills">${pills}</div></div>`;
}

function buildScores(sp){
  if(!sp||sp.length===0)return'';
  const chips=sp.slice(0,6).map((s,i)=>{
    const ec=s.esito==='1'?'e1':s.esito==='X'?'eX':'e2';
    return`<div class="sc ${i===0?'top1':''}"><div class="sc-res">${s.score}</div><div class="sc-pct">${s.prob}%</div><div class="sc-esito ${ec}">${s.esito}</div></div>`;
  }).join('');
  return`<div class="scores-grid">${chips}</div>`;
}

function om(id){
  const m=DATA.find(x=>x.id===id);if(!m)return;
  const oraLabel=m.ora?` · ⏰ ${m.ora}`:'';
  document.getElementById('ptl').textContent=m.home+' vs '+m.away;
  document.getElementById('pmt').textContent=m.league+' · '+m.date+oraLabel;
  const od=m.lh&&m.la?ou(m.lh,m.la):null,conf=m.conf||0;
  const dc=m.dec==='BET'?'bet':m.dec==='WATCH'?'watch':'skip';
  const dl=m.dec==='BET'?'⚡ BET':m.dec==='WATCH'?'👁 WATCH':'⛔ SKIP';

  let bdy=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
<div>
  <div style="font-family:'Syne',sans-serif;font-weight:800;font-size:17px;line-height:1.2">${m.home}<br><span style="color:var(--muted);font-size:12px;font-weight:400">vs</span> ${m.away}</div>
  <div style="font-size:10px;color:var(--muted);margin-top:4px">${m.league} · ${m.date}${oraLabel}</div>
</div>
<div class="db ${dc}">${dl}<span class="ds">conf ${(conf*100).toFixed(0)}%</span></div>
</div>`;

  // Scommessa consigliata
  if(m.dec==='BET'||m.dec==='WATCH'){
    bdy+=`<div style="background:rgba(0,212,170,.06);border:1px solid rgba(0,212,170,.2);border-radius:8px;padding:10px 12px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;">
<span style="font-family:'Syne',sans-serif;font-weight:700;font-size:13px;color:var(--accent)">${m.tipo||'—'}</span>
${m.stake>0?`<span style="font-size:11px;color:var(--muted)">Stake: €${m.stake.toFixed(0)}</span>`:''}
<span style="font-family:'Syne',sans-serif;font-weight:800;font-size:18px;">@${m.odds_bet>1?m.odds_bet.toFixed(2):'—'}</span>
</div>`;
  }

  // Quote
  bdy+=`<div class="st">📋 Quote</div>
<div class="op">
<div class="opb ${(m.v1||0)>0?'hot':''}"><div class="opl">1 Casa</div><div class="opv">${odd(m.o1)}</div>${vbadge(m.v1)}</div>
<div class="opb ${(m.vx||0)>0?'hot':''}"><div class="opl">X Pareggio</div><div class="opv">${odd(m.ox)}</div>${vbadge(m.vx)}</div>
<div class="opb ${(m.v2||0)>0?'hot':''}"><div class="opl">2 Ospite</div><div class="opv">${odd(m.o2)}</div>${vbadge(m.v2)}</div>
</div>`;

  // Lambda
  if(m.lh&&m.la)bdy+=`<div class="st">⚽ Gol attesi (λ)</div>
<div class="lg">
<div class="lb"><div class="lt">${m.home}</div><div class="lv">${m.lh.toFixed(2)}</div><div class="ll">λ Casa</div></div>
<div class="lb"><div class="lt">${m.away}</div><div class="lv">${m.la.toFixed(2)}</div><div class="ll">λ Ospite</div></div>
</div>
<div style="text-align:center;font-size:10px;color:var(--muted);margin-top:4px">Media gol: <b style="color:var(--text)">${(m.lh+m.la).toFixed(2)}</b></div>`;

  // Risultati esatti
  const scHtml=buildScores(m.score_probs);
  if(scHtml)bdy+=`<div class="st">🎲 Risultati esatti più probabili</div>${scHtml}`;

  // Forma
  const fhHtml=buildForma(m.forma_home,'🏠 '+m.home+' — ultimi 5');
  const faHtml=buildForma(m.forma_away,'✈️ '+m.away+' — ultimi 5');
  if(fhHtml||faHtml)bdy+=`<div class="st">📊 Forma recente</div>${fhHtml}${faHtml}`;

  // Confidence
  if(conf>0)bdy+=`<div class="st">🎯 Confidence & Kelly</div>
<div class="cr"><span class="cl">Confidence</span><div class="cbw"><div class="cbar" style="width:${(conf*100).toFixed(0)}%"></div></div><span class="cv">${(conf*100).toFixed(0)}%</span></div>
${m.kelly>0?`<div class="cr"><span class="cl">Kelly</span><div class="cbw"><div class="cbar" style="width:${Math.min(m.kelly*500,100)}%;background:var(--yellow)"></div></div><span class="cv" style="color:var(--yellow)">${(m.kelly*100).toFixed(1)}%</span></div>`:''}`;

  // Prob 1X2
  if(m.p1!=null)bdy+=`<div class="st">🎯 Prob 1X2</div>
<div class="pr"><span class="pl">1 Casa</span><div class="pbw"><div class="pbar" style="width:${pct(m.p1)}"></div></div><span class="pp">${pct(m.p1)}</span><span class="fq">F ${fair(m.p1)}</span></div>
<div class="pr"><span class="pl">X Pareg.</span><div class="pbw"><div class="pbar am" style="width:${pct(m.px)}"></div></div><span class="pp">${pct(m.px)}</span><span class="fq">F ${fair(m.px)}</span></div>
<div class="pr"><span class="pl">2 Ospite</span><div class="pbw"><div class="pbar rd" style="width:${pct(m.p2)}"></div></div><span class="pp">${pct(m.p2)}</span><span class="fq">F ${fair(m.p2)}</span></div>`;

  // Over/Under
  if(od)bdy+=`<div class="st">📈 Over/Under & GG</div>
<div class="og">${[['Over 0.5',od.ov05,'var(--accent)'],['Over 1.5',od.ov15,'var(--accent)'],['Over 2.5',od.ov25,'var(--blue)'],['Over 3.5',od.ov35,'var(--yellow)'],['GG',od.gg,'var(--accent)'],['NG',1-od.gg,'var(--red)']].map(([l,v,c])=>`<div class="oub"><div class="oul">${l}</div><div class="oup" style="color:${c}">${pct(v)}</div><div class="ouf">F ${fair(v)}</div></div>`).join('')}</div>`;

  bdy+=`<div class="nb">📌 Fair = quota equa modello Poisson+DC<br>📌 Value% = prob×quota−1<br>📌 Agg: ${DATA_TIMESTAMP||'—'}</div>`;

  document.getElementById('pb').innerHTML=bdy;
  document.getElementById('pn').classList.add('open');
  document.getElementById('lw').classList.add('po');
}

function cp(){document.getElementById('pn').classList.remove('open');document.getElementById('lw').classList.remove('po');}

let tx=0;
document.getElementById('pn').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.getElementById('pn').addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-tx>60)cp();},{passive:true});

function init(){
  if(typeof LIVE_DATA!=='undefined'&&LIVE_DATA.length>0){
    DATA=LIVE_DATA.map(ar).filter(m=>m.home&&m.away);
  }
  render();
}
buildChips();
init();
</script>
</body>
</html>
