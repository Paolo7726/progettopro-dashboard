<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Progetto Pro — Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #080c14;
  --surface:  #0d1420;
  --card:     #111827;
  --border:   #1e2d45;
  --accent:   #00d4ff;
  --green:    #00e676;
  --yellow:   #ffc107;
  --red:      #ff5252;
  --muted:    #4a6080;
  --text:     #e8f0fe;
  --text2:    #8fa8c8;
  --font-mono: 'JetBrains Mono', monospace;
  --font-ui:   'Syne', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #0a1628 0%, #0d1f3c 100%);
  border-bottom: 1px solid var(--border);
  padding: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(10px);
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.logo {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--accent);
}
.logo span { color: var(--text); }
.ts {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--muted);
}

/* ── KPI BAR ── */
.kpi-bar {
  display: flex;
  gap: 8px;
}
.kpi-pill {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 0.72rem;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 5px;
}
.kpi-pill b { color: var(--text); }
.kpi-pill.bet-pill { border-color: var(--green); color: var(--green); }
.kpi-pill.watch-pill { border-color: var(--yellow); color: var(--yellow); }

/* ── FILTRI ── */
.filters {
  padding: 12px 16px 0;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filter-btn {
  white-space: nowrap;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 0.72rem;
  color: var(--text2);
  cursor: pointer;
  font-family: var(--font-ui);
  font-weight: 600;
  transition: all 0.15s;
}
.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #000;
}

/* ── CARDS ── */
.cards { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: transform 0.15s;
}
.card:active { transform: scale(0.99); }

/* Bordo sinistro colorato per decisione */
.card.bet   { border-left: 3px solid var(--green); }
.card.watch { border-left: 3px solid var(--yellow); }
.card.skip  { border-left: 3px solid var(--border); }

/* ── CARD HEADER ── */
.card-head {
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--border);
}
.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.league-tag {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
}
.match-datetime {
  display: flex;
  align-items: center;
  gap: 6px;
}
.match-date {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--muted);
}
.match-time {
  background: rgba(0,212,255,0.1);
  border: 1px solid rgba(0,212,255,0.3);
  border-radius: 6px;
  padding: 2px 7px;
  font-family: var(--font-mono);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--accent);
}

/* ── SQUADRE ── */
.teams {
  display: flex;
  align-items: center;
  gap: 8px;
}
.team-name {
  font-size: 0.95rem;
  font-weight: 700;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.team-name.away { text-align: right; }
.vs-sep {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--muted);
  font-weight: 600;
  flex-shrink: 0;
}

/* ── BADGE DECISIONE ── */
.decision-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.3px;
}
.decision-badge.bet   { background: rgba(0,230,118,0.12); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
.decision-badge.watch { background: rgba(255,193,7,0.12);  color: var(--yellow); border: 1px solid rgba(255,193,7,0.3); }
.decision-badge.skip  { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border); }

/* ── CARD BODY ── */
.card-body { padding: 10px 14px; }

/* ── SCOMMESSA ── */
.bet-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
  background: rgba(0,230,118,0.06);
  border: 1px solid rgba(0,230,118,0.15);
  border-radius: 10px;
  padding: 8px 10px;
}
.bet-tipo {
  font-family: var(--font-mono);
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--green);
}
.bet-quota {
  font-family: var(--font-mono);
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text);
  margin-left: auto;
}
.bet-stake {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text2);
}

/* ── METRICHE ── */
.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 10px;
}
.metric {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
  text-align: center;
}
.metric-label {
  font-size: 0.55rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2px;
}
.metric-value {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text);
}
.metric-value.pos { color: var(--green); }
.metric-value.neg { color: var(--red); }
.metric-value.warn { color: var(--yellow); }

/* ── PROBABILITÀ 1X2 ── */
.probs-bar {
  display: flex;
  border-radius: 8px;
  overflow: hidden;
  height: 6px;
  margin-bottom: 4px;
}
.prob-seg-1  { background: var(--green); }
.prob-seg-x  { background: var(--yellow); }
.prob-seg-2  { background: var(--red); }

.prob-labels {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
}
.prob-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text2);
  text-align: center;
  flex: 1;
}
.prob-label b { display: block; color: var(--text); font-size: 0.75rem; }

/* ── COLLAPSIBLE ── */
.expand-btn {
  width: 100%;
  background: none;
  border: none;
  border-top: 1px solid var(--border);
  padding: 8px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  font-family: var(--font-ui);
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--text2);
  transition: color 0.15s;
}
.expand-btn:hover { color: var(--accent); }
.expand-icon { transition: transform 0.2s; font-size: 0.8rem; }
.expand-btn.open .expand-icon { transform: rotate(180deg); }

.expand-content {
  display: none;
  padding: 10px 14px 12px;
  border-top: 1px solid var(--border);
}
.expand-content.open { display: block; }

/* ── RISULTATI ESATTI ── */
.scores-title {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.scores-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 14px;
}
.score-chip {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 4px;
  text-align: center;
}
.score-chip.top1 { border-color: rgba(0,212,255,0.4); background: rgba(0,212,255,0.07); }
.score-result {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
}
.score-pct {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--text2);
}
.score-esito {
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.3px;
  margin-top: 1px;
}
.score-esito.e1 { color: var(--green); }
.score-esito.eX { color: var(--yellow); }
.score-esito.e2 { color: var(--red); }

/* ── FORMA ── */
.forma-section { margin-bottom: 6px; }
.forma-team-label {
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.4px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 5px;
}
.forma-row {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-bottom: 8px;
}
.forma-pill {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  font-weight: 700;
  flex-shrink: 0;
}
.forma-pill.W { background: rgba(0,230,118,0.15); color: var(--green); border: 1px solid rgba(0,230,118,0.3); }
.forma-pill.D { background: rgba(255,193,7,0.12);  color: var(--yellow); border: 1px solid rgba(255,193,7,0.3); }
.forma-pill.L { background: rgba(255,82,82,0.12);  color: var(--red); border: 1px solid rgba(255,82,82,0.3); }
.forma-score {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--muted);
  line-height: 1.2;
}
.forma-score b { color: var(--text2); }

/* ── QUOTE ── */
.odds-row {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}
.odd-chip {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px;
  text-align: center;
}
.odd-label {
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--muted);
}
.odd-value {
  font-family: var(--font-mono);
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text);
}

/* ── EMPTY STATE ── */
.empty {
  text-align: center;
  padding: 60px 24px;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; }
.empty-title { font-size: 1.1rem; font-weight: 700; color: var(--text2); margin-bottom: 6px; }
.empty-sub { font-size: 0.8rem; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 8px 0 12px;
  z-index: 100;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.3px;
  padding: 4px 0;
  transition: color 0.15s;
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 1.1rem; }
</style>
</head>

var DATA_TIMESTAMP = "26/05/2026 07:54";

// ════════════════════════════════════════════════════════════
//  STATO APP
// ════════════════════════════════════════════════════════════
var currentFilter = 'ALL';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCards();
}

// ════════════════════════════════════════════════════════════
//  UTILITÀ DATE
// ════════════════════════════════════════════════════════════
function parseDate(s) {
  if (!s) return null;
  s = String(s).trim();
  // ISO: 2026-05-24
  var m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  // Italiano: "SABATO 23 MAGGIO 2026"
  var MESI = {GENNAIO:0,FEBBRAIO:1,MARZO:2,APRILE:3,MAGGIO:4,GIUGNO:5,
              LUGLIO:6,AGOSTO:7,SETTEMBRE:8,OTTOBRE:9,NOVEMBRE:10,DICEMBRE:11};
  var su = s.toUpperCase();
  for (var mese in MESI) {
    if (su.indexOf(mese) >= 0) {
      var nums = su.match(/\d+/g) || [];
      var g = nums.find(n => +n <= 31) || 1;
      var a = nums.find(n => n.length === 4 && +n >= 2020) || new Date().getFullYear();
      return new Date(+a, MESI[mese], +g);
    }
  }
  return null;
}

function formatDate(s) {
  var d = parseDate(s);
  if (!d) return s || '—';
  var giorni = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  var mesi   = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
  return giorni[d.getDay()] + ' ' + d.getDate() + ' ' + mesi[d.getMonth()];
}

function isToday(s) {
  var d = parseDate(s);
  if (!d) return false;
  var now = new Date();
  return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
}

// ════════════════════════════════════════════════════════════
//  RENDER PRINCIPALE
// ════════════════════════════════════════════════════════════
function renderCards() {
  var today = new Date();
  today.setHours(0,0,0,0);

  // Filtra
  var data = LIVE_DATA.filter(function(r) {
    var d = parseDate(r.Date);
    var isFuture = !d || d >= today;
    if (!isFuture) return false;
    if (currentFilter === 'BET')   return r.Decision === 'BET';
    if (currentFilter === 'WATCH') return r.Decision === 'WATCH';
    if (currentFilter === 'SKIP')  return r.Decision === 'SKIP';
    if (currentFilter === 'OGGI')  return isToday(r.Date);
    return true;
  });

  // Ordina: BET > WATCH > SKIP, poi per data e ora
  data.sort(function(a,b) {
    var ord = {BET:0,WATCH:1,SKIP:2};
    var oa = ord[a.Decision]||2, ob = ord[b.Decision]||2;
    if (oa !== ob) return oa - ob;
    var da = parseDate(a.Date)||new Date(9999,0);
    var db = parseDate(b.Date)||new Date(9999,0);
    if (da - db !== 0) return da - db;
    return (a.ORA||'').localeCompare(b.ORA||'');
  });

  var container = document.getElementById('cards-container');

  if (data.length === 0) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Nessuna partita</div><div class="empty-sub">Cambia filtro o aggiorna l\'engine</div></div>';
    return;
  }

  container.innerHTML = data.map(function(r, idx) {
    return buildCard(r, idx);
  }).join('');
}

// ════════════════════════════════════════════════════════════
//  COSTRUZIONE CARD
// ════════════════════════════════════════════════════════════
function buildCard(r, idx) {
  var dec = (r.Decision||'SKIP').toUpperCase();
  var decClass = dec === 'BET' ? 'bet' : dec === 'WATCH' ? 'watch' : 'skip';
  var decLabel = dec === 'BET' ? '🎯 BET' : dec === 'WATCH' ? '👁 WATCH' : '— SKIP';

  // ── HEADER ──
  var dateStr = formatDate(r.Date);
  var timeStr = r.ORA ? r.ORA : '';
  var timeHtml = timeStr
    ? '<span class="match-time">⏰ ' + timeStr + '</span>'
    : '';

  // ── SQUADRE ──
  var home = r.Home || '?';
  var away = r.Away || '?';

  var value = r.Value_Max != null ? (r.Value_Max * 100).toFixed(1) + '%' : '—';
  var conf  = r.Confidence != null ? (r.Confidence * 100).toFixed(0) + '%' : '—';
  var ev    = r.EV != null ? (r.EV > 0 ? '+' : '') + (r.EV * 100).toFixed(1) + '%' : '—';
  var kelly = r.Kelly != null ? (r.Kelly * 100).toFixed(1) + '%' : '—';
  var lh    = r.lam_h != null ? r.lam_h.toFixed(2) : '—';
  var la    = r.lam_a != null ? r.lam_a.toFixed(2) : '—';

  var p1 = r.Prob1 || 0, px = r.ProbX || 0, p2 = r.Prob2 || 0;
  var pSum = p1 + px + p2 || 1;
  var p1p = (p1/pSum*100).toFixed(0);
  var pxp = (px/pSum*100).toFixed(0);
  var p2p = (p2/pSum*100).toFixed(0);

  // ── SCOMMESSA ──
  var betHtml = '';
  if (dec === 'BET' || dec === 'WATCH') {
    var tipo  = r.TipoScommessa || '—';
    var quota = r.Odds_Bet ? parseFloat(r.Odds_Bet).toFixed(2) : '—';
    var stake = r.Stake ? '€' + parseFloat(r.Stake).toFixed(0) : '';
    betHtml = '<div class="bet-row">'

      + (stake ? '<span class="bet-stake">' + stake + '</span>' : '')
      + '<span class="bet-quota">@' + quota + '</span>'
      + '</div>';
  }

  // ── RISULTATI ESATTI ──
  var scoresHtml = '';
  var sp = r.score_probs || [];
  if (sp.length > 0) {
    scoresHtml = '<div class="scores-title">🎲 Risultati esatti più probabili</div>'
      + '<div class="scores-grid">'
      + sp.slice(0,6).map(function(s, i) {
          var esitoCls = s.esito === '1' ? 'e1' : s.esito === 'X' ? 'eX' : 'e2';
          return '<div class="score-chip' + (i===0?' top1':'') + '">'
            + '<div class="score-result">' + s.score + '</div>'
            + '<div class="score-pct">' + s.prob + '%</div>'
            + '<div class="score-esito ' + esitoCls + '">' + s.esito + '</div>'
            + '</div>';
        }).join('')
      + '</div>';
  }

  // ── FORMA ──
  function buildForma(forma, label) {
    if (!forma || forma.length === 0) return '';
    return '<div class="forma-section">'
      + '<div class="forma-team-label">' + label + '</div>'
      + '<div class="forma-row">'
      + forma.slice(0,5).map(function(f) {
          return '<div class="forma-pill ' + f.ris + '">' + f.ris + '</div>';
        }).join('')
      + '<div style="margin-left:4px">'
      + forma.slice(0,5).map(function(f) {
          return '<div class="forma-score"><b>' + f.gf + '-' + f.gs + '</b> vs ' + f.opp + '</div>';
        }).join('')
      + '</div>'
      + '</div>'
      + '</div>';
  }
  var formaHtml = buildForma(r.forma_home, '🏠 ' + home)
                + buildForma(r.forma_away, '✈️ ' + away);

  // ── QUOTE BOX ──
  var quotesHtml = '<div class="scores-title" style="margin-top:8px">📈 Quote mercato</div>'
    + '<div class="odds-row">'
    + '<div class="odd-chip"><div class="odd-label">1</div><div class="odd-value">' + (r.Odd1 ? parseFloat(r.Odd1).toFixed(2) : '—') + '</div></div>'
    + '<div class="odd-chip"><div class="odd-label">X</div><div class="odd-value">' + (r.OddX ? parseFloat(r.OddX).toFixed(2) : '—') + '</div></div>'
    + '<div class="odd-chip"><div class="odd-label">2</div><div class="odd-value">' + (r.Odd2 ? parseFloat(r.Odd2).toFixed(2) : '—') + '</div></div>'
    + '<div class="odd-chip"><div class="odd-label">OV25</div><div class="odd-value">' + (r.Odd_OV25 ? parseFloat(r.Odd_OV25).toFixed(2) : '—') + '</div></div>'
    + '<div class="odd-chip"><div class="odd-label">GG</div><div class="odd-value">' + (r.Odd_GG ? parseFloat(r.Odd_GG).toFixed(2) : '—') + '</div></div>'
    + '</div>';

  var expandId = 'exp-' + idx;

  return '<div class="card ' + decClass + '">'
    // HEAD
    + '<div class="card-head">'
    + '<div class="card-meta">'
    + '<span class="league-tag">⚽ ' + (r.Campionato||'—') + '</span>'
    + '<div class="match-datetime">'
    + '<span class="match-date">' + dateStr + '</span>'
    + timeHtml
    + '</div>'
    + '</div>'
    + '<div class="teams">'
    + '<span class="team-name">' + home + '</span>'
    + '<span class="vs-sep">vs</span>'
    + '<span class="team-name away">' + away + '</span>'
    + '</div>'

    // BODY
    + '<div class="card-body">'
    + betHtml
    // Metriche
    + '<div class="metrics">'
    + '<div class="metric"><div class="metric-label">Value</div><div class="metric-value ' + valueClass + '">' + value + '</div></div>'
    + '<div class="metric"><div class="metric-label">Conf.</div><div class="metric-value ' + confClass + '">' + conf + '</div></div>'

    + '<div class="metric"><div class="metric-label">λ Trasferta</div><div class="metric-value">' + la + '</div></div>'
    + '</div>'
    // Barra probabilità
    + '<div class="probs-bar">'
    + '<div class="prob-seg-1" style="width:' + p1p + '%"></div>'
    + '<div class="prob-seg-x" style="width:' + pxp + '%"></div>'

    + quotesHtml
    + '</div>'

}

function toggleExpand(id, btn) {
  var el = document.getElementById(id);
  var isOpen = el.classList.toggle('open');

function init() {

window.addEventListener('DOMContentLoaded', init);
