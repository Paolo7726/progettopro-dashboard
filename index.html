<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ProgettoPro · Scanner</title>
<style>
:root{--bg:#080b10;--surf:#0f1420;--card:#141928;--brd:#1e2a3d;--acc:#00d4aa;--yel:#f7b731;--red:#e74c5e;--blu:#4a9eff;--mut:#5a6580;--txt:#e8edf5;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--txt);font-family:monospace;min-height:100vh;}
.hdr{background:var(--surf);border-bottom:1px solid var(--brd);padding:12px 16px;position:sticky;top:0;z-index:10;}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.logo{font-size:17px;font-weight:900;color:var(--acc);font-family:sans-serif;}
.logo span{color:var(--txt);}
.kpi{font-size:11px;color:var(--mut);}
.kpi b{color:var(--txt);}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:5px 13px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid var(--brd);background:transparent;color:var(--mut);cursor:pointer;white-space:nowrap;font-family:sans-serif;}
.chip.on{background:var(--acc);color:#000;border-color:var(--acc);}
.list{padding:12px;}
.grp{margin-bottom:14px;}
.glbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mut);padding:0 4px 6px;border-bottom:1px solid var(--brd);margin-bottom:8px;font-family:sans-serif;}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;border-left:3px solid var(--brd);}
.card.bet{border-left-color:var(--acc);}
.card.watch{border-left-color:var(--yel);}
.cmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.camp{font-size:10px;color:var(--mut);font-family:sans-serif;font-weight:700;}
.cright{display:flex;align-items:center;gap:6px;}
.ora{background:rgba(74,158,255,.1);border:1px solid rgba(74,158,255,.3);border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--blu);font-family:sans-serif;}
.bdg{border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;font-family:sans-serif;}
.bdg.bet{background:rgba(0,212,170,.15);color:var(--acc);}
.bdg.watch{background:rgba(247,183,49,.12);color:var(--yel);}
.teams{font-size:15px;font-weight:700;margin-bottom:10px;font-family:sans-serif;}
.teams .vs{color:var(--mut);font-size:11px;font-weight:400;margin:0 6px;}
.odds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.ob{background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:7px 6px;text-align:center;}
.ob.hot{border-color:var(--acc);background:rgba(0,212,170,.07);}
.ol{font-size:9px;color:var(--mut);display:block;margin-bottom:2px;}
.ov{font-size:15px;font-weight:700;font-family:sans-serif;}
.ob.hot .ov{color:var(--acc);}
.vb{font-size:9px;display:block;margin-top:2px;font-weight:600;}
.vb.pos{color:var(--acc);}
.vb.neg{color:var(--red);opacity:.7;}
/* PANNELLO */
.pan{position:fixed;top:0;bottom:0;left:0;right:0;background:var(--surf);overflow-y:auto;transform:translateX(100%);transition:transform .3s ease;z-index:20;}
.pan.open{transform:none;}
.pbk{position:sticky;top:0;background:var(--surf);border-bottom:1px solid var(--brd);padding:12px 16px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.bka{font-size:20px;color:var(--acc);}
.pti{font-size:14px;font-weight:700;font-family:sans-serif;}
.psu{font-size:10px;color:var(--mut);}
.pb{padding:16px 16px 40px;}
.sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:16px 0 8px;font-family:sans-serif;display:flex;align-items:center;gap:8px;}
.sec::after{content:'';flex:1;height:1px;background:var(--brd);}
.og3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.ob2{background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:10px 8px;text-align:center;}
.ob2.hot{border-color:var(--acc);background:rgba(0,212,170,.07);}
.ol2{font-size:9px;color:var(--mut);margin-bottom:4px;font-family:sans-serif;}
.ov2{font-size:22px;font-weight:900;font-family:sans-serif;}
.ob2.hot .ov2{color:var(--acc);}
.ovb{font-size:10px;padding:2px 5px;border-radius:3px;font-weight:600;margin-top:3px;display:inline-block;}
.ovb.pos{background:rgba(0,212,170,.15);color:var(--acc);}
.ovb.neg{background:rgba(231,76,94,.1);color:var(--red);}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.lb2{background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:12px;text-align:center;}
.lt2{font-size:10px;color:var(--mut);margin-bottom:4px;font-family:sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lv2{font-size:28px;font-weight:900;color:var(--acc);font-family:sans-serif;}
.pr{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.pl{font-size:11px;color:var(--mut);width:70px;}
.pbw{flex:1;background:var(--brd);border-radius:3px;height:6px;overflow:hidden;}
.pbar{height:100%;border-radius:3px;background:var(--acc);}
.pbar.y{background:var(--yel);}
.pbar.r{background:var(--red);}
.pp{font-size:11px;font-weight:700;width:38px;text-align:right;}
.fq{font-size:10px;color:var(--mut);width:44px;text-align:right;}
/* SCORE PROBS */
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.sc{background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:8px 4px;text-align:center;}
.sc.t1{border-color:var(--acc);background:rgba(0,212,170,.06);}
.sr{font-size:17px;font-weight:900;font-family:sans-serif;}
.sp{font-size:10px;color:var(--mut);}
.se{font-size:9px;font-weight:700;margin-top:2px;}
.se.e1{color:var(--acc);} .se.eX{color:var(--yel);} .se.e2{color:var(--red);}
/* FORMA */
.fw{margin-bottom:12px;}
.fl{font-size:10px;color:var(--mut);margin-bottom:6px;font-family:sans-serif;}
.fps{display:flex;gap:6px;flex-wrap:wrap;}
.fp{display:flex;flex-direction:column;align-items:center;gap:2px;}
.fpp{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;font-family:sans-serif;}
.fpp.W{background:rgba(0,212,170,.15);color:var(--acc);border:1px solid rgba(0,212,170,.3);}
.fpp.D{background:rgba(247,183,49,.12);color:var(--yel);border:1px solid rgba(247,183,49,.3);}
.fpp.L{background:rgba(231,76,94,.12);color:var(--red);border:1px solid rgba(231,76,94,.3);}
.fs{font-size:9px;color:var(--mut);} .fo{font-size:8px;color:var(--mut);max-width:36px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}
/* OG6 */
.og6{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.ob3{background:var(--bg);border:1px solid var(--brd);border-radius:6px;padding:7px;text-align:center;}
.ol3{font-size:9px;color:var(--mut);font-family:sans-serif;}
.ov3{font-size:13px;font-weight:700;margin:2px 0;font-family:sans-serif;}
.of3{font-size:9px;color:var(--mut);}
.empty{text-align:center;padding:60px 20px;color:var(--mut);font-family:sans-serif;}
</style>
</head>
<body>
<div class="hdr">

  </div>

    <button class="chip on" onclick="sf('',this)">Tutti</button>

</div>
<div class="list" id="list"></div>

    <div><div class="pti" id="pti">—</div><div class="psu" id="psu">—</div></div>
  </div>
  <div class="pb" id="pb"></div>
</div>

function num(v){return v!=null&&v!==''&&!isNaN(v)?parseFloat(v):null;}

var MESI={'GENNAIO':'01','FEBBRAIO':'02','MARZO':'03','APRILE':'04','MAGGIO':'05','GIUGNO':'06','LUGLIO':'07','AGOSTO':'08','SETTEMBRE':'09','OTTOBRE':'10','NOVEMBRE':'11','DICEMBRE':'12'};
function toISO(s){
  if(!s)return'';
  s=String(s).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  var u=s.toUpperCase();
  for(var m in MESI){
    if(u.indexOf(m)>=0){
      var nums=u.match(/\d+/g)||[];
      var g=nums.find(function(n){return+n<=31;})||'01';
      var a=nums.find(function(n){return n.length===4&&+n>=2020;})||'2026';
      return a+'-'+MESI[m]+'-'+(g.length<2?'0'+g:g);
    }
  }
  return'';
}
function fmtDate(s){
  var d=toISO(s);
  if(!d)return s||'';
  try{
    var dt=new Date(d+'T12:00:00');
    var GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
    var MM=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
    return GG[dt.getDay()]+' '+dt.getDate()+' '+MM[dt.getMonth()];
  }catch(e){return d;}
}

    DATA.push(r);
  }
}

    function poiP(k,l){var f=1;for(var j=1;j<=k;j++)f*=j;return Math.exp(-l)*Math.pow(l,k)/f;}
    var ov25=0,ov35=0;
    for(var i=0;i<15;i++)for(var j=0;j<15;j++){if(i+j>2.5)ov25+=poiP(i,lh)*poiP(j,la);if(i+j>3.5)ov35+=poiP(i,lh)*poiP(j,la);}
    var gg=(1-Math.exp(-lh))*(1-Math.exp(-la));
    h+='<div class="sec">📈 Over/Under & GG</div>';
    h+='<div class="og6">';
    [[' OV 0.5',ov05,'var(--acc)'],[' OV 1.5',1-(1+t)*Math.exp(-t),'var(--acc)'],['OV 2.5',ov25,'var(--blu)'],['OV 3.5',ov35,'var(--yel)'],['GG',gg,'var(--acc)'],['NG',1-gg,'var(--red)']].forEach(function(x){
      h+='<div class="ob3"><div class="ol3">'+x[0]+'</div><div class="ov3" style="color:'+x[2]+'">'+(x[1]*100).toFixed(0)+'%</div><div class="of3">F '+(x[1]>0.01?(1/x[1]).toFixed(2):'—')+'</div></div>';
    });
    h+='</div>';
  }
  
  var conf=num(r.Confidence);
  if(conf){
    h+='<div class="sec">🎯 Confidence</div>';
    h+='<div class="pr"><span class="pl">Confidence</span><div class="pbw"><div class="pbar" style="width:'+(conf*100).toFixed(0)+'%;background:linear-gradient(90deg,var(--acc),var(--blu))"></div></div><span class="pp">'+(conf*100).toFixed(0)+'%</span></div>';
    var kelly=num(r.Kelly);
    if(kelly)h+='<div class="pr"><span class="pl">Kelly</span><div class="pbw"><div class="pbar y" style="width:'+Math.min(kelly*500,100).toFixed(0)+'%"></div></div><span class="pp">'+(kelly*100).toFixed(1)+'%</span></div>';
  }
  
  h+='<div style="margin-top:16px;background:var(--bg);border:1px solid var(--brd);border-radius:8px;padding:10px 12px;font-size:10px;color:var(--mut);line-height:1.8;">📌 Fair = quota equa modello Poisson+DC<br>📌 Value% = (prob_modello × quota) − 1<br>📌 Agg: '+DATA_TIMESTAMP+'</div>';
  
  document.getElementById('pb').innerHTML=h;
  document.getElementById('pan').classList.add('open');
}

function cp(){document.getElementById('pan').classList.remove('open');}

// Swipe per chiudere pannello
var tx=0;
document.getElementById('pan').addEventListener('touchstart',function(e){tx=e.touches[0].clientX;},{passive:true});
document.getElementById('pan').addEventListener('touchend',function(e){if(e.changedTouches[0].clientX-tx>60)cp();},{passive:true});

// Avvia
prep();
buildChips();
render();
</script>
